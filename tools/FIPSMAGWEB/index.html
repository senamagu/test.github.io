<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS Studio v0.1</title><style>
:root{--accent:#69a89a;--bg:#f7f8f7;--paper:#fff;--ink:#27312f;--line:#dce4e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;padding:9px 12px;color:inherit}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:13px 22px;background:white;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.04em}.brand small{font-weight:400;color:#788}.actions{display:flex;gap:7px;flex-wrap:wrap}.wrap{max-width:1200px;margin:22px auto;padding:0 18px}.meta{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.meta input{border:1px solid var(--line);border-radius:8px;padding:10px;background:white}.meta #title{flex:1;min-width:200px;font-size:18px;font-weight:700}.meta #series{width:190px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:16px}.paper{background:white;border:1px solid var(--line);border-radius:14px;min-height:480px;padding:30px;box-shadow:0 4px 18px #1c3e3009}.block{position:relative;margin:10px 0;padding:8px 10px;border:1px solid transparent;border-radius:8px}.block:hover,.block:focus-within{border-color:var(--line)}.block.selected{border-color:var(--accent);background:#f7fbfa}.editable{outline:none;min-height:28px;white-space:pre-wrap;line-height:1.95;overflow-wrap:anywhere}.editable:empty:before{content:attr(data-placeholder);color:#aab5b0}.dialogue{display:flex;gap:12px;align-items:flex-start}.avatar{width:50px;height:50px;border-radius:9px;object-fit:cover;background:#d8e7e2;flex-shrink:0}.speaker{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}.still{max-width:100%;max-height:440px;display:block;margin:auto;border-radius:6px;object-fit:contain}.still-placeholder{padding:50px 10px;text-align:center;background:#edf3f0;color:#879c94;border-radius:8px}.block-tools{display:none;gap:5px;position:absolute;right:3px;top:-28px;z-index:3}.block:hover .block-tools,.block.selected .block-tools{display:flex}.block-tools button{padding:3px 7px;font-size:11px;background:white}.sidebar{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;height:max-content;position:sticky;top:12px}.sidebar h3{font-size:14px;margin:0 0 12px}.sidebar label{display:block;font-size:12px;color:#677c73;margin:12px 0 5px}.sidebar input,.sidebar select{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:white}.sidebar .hint{font-size:12px;line-height:1.7;color:#7b8b85}.insert{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.insert button{flex:1;white-space:nowrap}.hidden{display:none!important}.preview .block{border:0!important;background:transparent!important}.preview .block-tools,.preview .insert,.preview .sidebar{display:none!important}.preview .layout{grid-template-columns:minmax(0,760px);justify-content:center}.preview .paper{padding:42px 38px}.preview .editable{pointer-events:none}.preview .block{margin:22px 0}.preview .reveal{opacity:0;transform:translateY(18px)}.preview .reveal.seen{animation:fadeup .65s ease forwards}.preview .effect-shake.seen{animation:shake .35s infinite}.preview .effect-float.seen{animation:float 1.5s ease-in-out infinite}.preview .effect-zoom.seen{animation:zoom .65s ease forwards}.preview .effect-none{opacity:1;transform:none}.preview .effect-shake,.preview .effect-float{opacity:1;transform:none}@keyframes fadeup{to{opacity:1;transform:none}}@keyframes zoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.preview .block:not(.inview).effect-shake,.preview .block:not(.inview).effect-float{animation-play-state:paused}.formatbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:12px 0}.formatbar button{padding:5px 10px}.formatbar input{width:36px;height:30px;padding:2px;border:0;background:transparent}.status{font-size:12px;color:#789}.reader-title{font-size:26px;font-weight:800;margin-bottom:12px}.reader-series{font-size:12px;color:var(--accent);margin-bottom:5px}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{position:static}.paper{padding:15px}.preview .paper{padding:22px 14px}.meta #series{width:100%}}@media(prefers-reduced-motion:reduce){.preview .reveal,.preview .reveal.seen{animation:none!important;opacity:1;transform:none}}
</style></head><body><header><div class="brand">SS Studio <small>v0.1 · 試作版</small></div><div class="actions"><button id="mode">プレビュー</button><button id="export">JSON保存</button><button id="import">JSON読込</button><button id="reset">新規作成</button><button id="save" class="primary">下書き保存</button></div></header><main class="wrap" id="app"><div class="meta"><input id="title" placeholder="SSのタイトル"><input id="series" placeholder="作品・シリーズ名"><span class="status" id="status">この端末に自動保存</span></div><div class="formatbar" id="formatbar"><span style="font-size:12px;color:#789">文字を選択して装飾：</span><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><input type="color" id="color" value="#d45d5d" title="選択文字の色"><button id="partialshake">選択文字を震わせる</button></div><div class="layout"><section><div class="paper" id="paper"><div id="blocks"></div><div class="insert" id="insert"><button data-add="text">＋ 文章</button><button data-add="dialogue">＋ 会話</button><button data-add="image">＋ スチル</button></div></div></section><aside class="sidebar"><h3>選択ブロックの設定</h3><div id="empty">文章や会話をクリックして編集しよう。</div><div id="settings" class="hidden"><label>アニメーション</label><select id="effect"><option value="none">なし</option><option value="fade">フェードイン</option><option value="zoom">ズームイン</option><option value="shake">震える（ループ）</option><option value="float">浮遊（ループ）</option></select><div id="speakerFields" class="hidden"><label>キャラクター名</label><input id="speaker" placeholder="名前"><label>アイコン画像</label><input id="avatarfile" type="file" accept="image/*"><div class="hint">画像は試作版ではブラウザ内に保存するため、小さな画像がおすすめ。</div></div><div id="imageFields" class="hidden"><label>スチル画像</label><input id="stillfile" type="file" accept="image/*"><div class="hint">大きな画像はブラウザの保存容量を圧迫する。公開版ではR2に保存予定。</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="hint">この版はログイン・オンライン共有・公開URLには未対応。まず執筆と表示を試すための単体HTML版だよ。JSONでバックアップを取ってね。</div></aside></div></main><input type="file" id="jsonfile" accept="application/json,.json" hidden><script>
const $=id=>document.getElementById(id);let data={title:'',series:'',blocks:[{id:1,type:'text',text:'ここから物語を書こう。',effect:'none'}]},selected=1,preview=false,nextId=2,observer=null;const key='ss-studio-v01';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sanitize=s=>{let d=document.createElement('div');d.innerHTML=s||'';d.querySelectorAll('script,style,iframe,object,embed').forEach(e=>e.remove());d.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{if(a.name.startsWith('on')||['href','src','style'].includes(a.name))e.removeAttribute(a.name)});});return d.innerHTML};function persist(){try{localStorage.setItem(key,JSON.stringify(data));$('status').textContent='保存済み'}catch(e){$('status').textContent='容量超過！ JSON保存してね'}}function sync(){document.querySelectorAll('.block').forEach(el=>{const b=data.blocks.find(b=>b.id===Number(el.dataset.id));if(!b)return;const edit=el.querySelector('.editable');if(edit)b.text=edit.innerHTML});data.title=$('title').value;data.series=$('series').value;persist()};function render(){if(observer)observer.disconnect();$('title').value=data.title||'';$('series').value=data.series||'';$('blocks').innerHTML='';if(preview){let h=document.createElement('div');h.innerHTML=`<div class="reader-series">${esc(data.series)}</div><div class="reader-title">${esc(data.title||'無題のSS')}</div>`;$('blocks').append(h)}data.blocks.forEach(b=>{let el=document.createElement('article');el.className='block '+(selected===b.id&&!preview?'selected ':'')+(preview?'reveal effect-'+(b.effect||'none'):'');el.dataset.id=b.id;let tools=document.createElement('div');tools.className='block-tools';tools.innerHTML='<button data-act="up">↑</button><button data-act="down">↓</button><button data-act="clone">複製</button><button data-act="delete">削除</button>';el.append(tools);if(b.type==='image'){let image=b.src?`<img class="still" src="${esc(b.src)}" alt="スチル">`:'<div class="still-placeholder">右側からスチル画像を選択</div>';el.insertAdjacentHTML('beforeend',image)}else if(b.type==='dialogue'){let row=document.createElement('div');row.className='dialogue';row.innerHTML=`<img class="avatar" alt="" src="${esc(b.avatar||defaultAvatar())}"><div style="flex:1;min-width:0"><div class="speaker">${esc(b.speaker||'キャラクター')}</div><div class="editable" data-placeholder="セリフを入力" ${preview?'':'contenteditable="true"'}>${sanitize(b.text||'')}</div></div>`;el.append(row)}else{let edit=document.createElement('div');edit.className='editable';edit.dataset.placeholder='文章を入力';if(!preview)edit.contentEditable='true';edit.innerHTML=sanitize(b.text||'');el.append(edit)}el.addEventListener('click',e=>{if(preview)return;let act=e.target.closest('[data-act]');if(act){sync();const i=data.blocks.findIndex(x=>x.id===b.id);if(act.dataset.act==='delete'){data.blocks.splice(i,1);selected=data.blocks[0]?.id||null}else if(act.dataset.act==='clone'){let c={...b,id:nextId++};data.blocks.splice(i+1,0,c);selected=c.id}else if(act.dataset.act==='up'&&i>0){[data.blocks[i-1],data.blocks[i]]=[data.blocks[i],data.blocks[i-1]]}else if(act.dataset.act==='down'&&i<data.blocks.length-1){[data.blocks[i+1],data.blocks[i]]=[data.blocks[i],data.blocks[i+1]]}persist();render();return}if(selected!==b.id){selected=b.id;document.querySelectorAll('.block').forEach(x=>x.classList.toggle('selected',Number(x.dataset.id)===selected));settings()}});el.addEventListener('input',()=>{const edit=el.querySelector('.editable');if(edit){b.text=edit.innerHTML;persist()}});$('blocks').append(el)});settings();if(preview){observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen','inview');if(['shake','float'].includes(data.blocks.find(b=>b.id===Number(e.target.dataset.id))?.effect)){}else observer.unobserve(e.target)}else e.target.classList.remove('inview')}),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el))}}function defaultAvatar(){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#d8e7e2"/><circle cx="50" cy="38" r="18" fill="#87b6a6"/><path d="M18 94Q20 61 50 61Q80 61 82 94" fill="#87b6a6"/></svg>')};function settings(){const b=data.blocks.find(b=>b.id===selected);$('empty').classList.toggle('hidden',!!b);$('settings').classList.toggle('hidden',!b);if(!b)return;$('effect').value=b.effect||'none';$('speakerFields').classList.toggle('hidden',b.type!=='dialogue');$('imageFields').classList.toggle('hidden',b.type!=='image');$('speaker').value=b.speaker||''}function add(type){sync();let b={id:nextId++,type,text:'',effect:'none'};if(type==='dialogue')b.speaker='キャラクター';data.blocks.push(b);selected=b.id;persist();render();document.querySelector('.block:last-child')?.scrollIntoView({behavior:'smooth',block:'center'})}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('title').oninput=sync;$('series').oninput=sync;$('effect').onchange=e=>{let b=data.blocks.find(b=>b.id===selected);if(b){b.effect=e.target.value;persist()}};$('speaker').oninput=e=>{let b=data.blocks.find(b=>b.id===selected);if(b){b.speaker=e.target.value;document.querySelector('.block.selected .speaker').textContent=b.speaker;persist()}};function fileToData(file,cb){if(!file)return;let reader=new FileReader();reader.onload=()=>cb(reader.result);reader.readAsDataURL(file)};$('avatarfile').onchange=e=>fileToData(e.target.files[0],src=>{let b=data.blocks.find(b=>b.id===selected);if(b){b.avatar=src;persist();render()}});$('stillfile').onchange=e=>fileToData(e.target.files[0],src=>{let b=data.blocks.find(b=>b.id===selected);if(b){b.src=src;persist();render()}});$('mode').onclick=()=>{sync();preview=!preview;$('app').classList.toggle('preview',preview);$('mode').textContent=preview?'編集に戻る':'プレビュー';$('formatbar').classList.toggle('hidden',preview);render();window.scrollTo(0,0)};$('save').onclick=()=>{sync();alert('このブラウザに保存したよ。バックアップは「JSON保存」を使ってね。')};$('export').onclick=()=>{sync();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='ss-'+(data.title||'draft').replace(/[\\/:*?"<>|]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};$('import').onclick=()=>$('jsonfile').click();$('jsonfile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.blocks))throw Error('形式が違う');data={title:String(obj.title||''),series:String(obj.series||''),blocks:obj.blocks.filter(b=>['text','dialogue','image'].includes(b.type)).map((b,i)=>({...b,id:i+1,text:sanitize(b.text||'')}))};nextId=data.blocks.length+1;selected=data.blocks[0]?.id||null;persist();render()}catch(err){alert('JSONを読み込めなかった: '+err.message)}e.target.value=''};$('reset').onclick=()=>{if(!confirm('新しいSSを作成する？ 現在の下書きは上書きされるので、必要ならJSON保存してね。'))return;data={title:'',series:'',blocks:[{id:1,type:'text',text:'',effect:'none'}]};nextId=2;selected=1;persist();render()};document.querySelectorAll('[data-cmd]').forEach(b=>b.onmousedown=e=>e.preventDefault());document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,null);sync()});$('color').oninput=e=>{document.execCommand('foreColor',false,e.target.value);sync()};$('partialshake').onmousedown=e=>e.preventDefault();$('partialshake').onclick=()=>{const sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return;let r=sel.getRangeAt(0),parent=r.commonAncestorContainer.parentElement;if(!parent.closest('.editable'))return;let span=document.createElement('span');span.style.cssText='display:inline-block;animation:shake .35s infinite';try{r.surroundContents(span);sync()}catch(e){alert('複数の装飾にまたがる選択にはまだ対応していないよ')}};try{let saved=localStorage.getItem(key);if(saved){let obj=JSON.parse(saved);if(Array.isArray(obj.blocks)){data=obj;nextId=Math.max(0,...data.blocks.map(b=>Number(b.id)||0))+1;selected=data.blocks[0]?.id||null}}}catch(e){}render();
</script></body></html>
