ckground:#eef5f1;padding:45px;text-align:center;color:#82978b}.insert{display:flex;gap:8px;margin:14px 0}.insert button{flex:1}.hidden{display:none!important}.partial-shake{display:inline-block;animation:random-shake .32s steps(1,end) infinite}.partial-bounce{display:inline-block;animation:bounce-settle .85s ease-out both}.partial-fade{display:inline-block;animation:fade-in .65s ease both}@keyframes random-shake{0%,100%{transform:translate(0,0)}10%{transform:translate(calc(-.7 * var(--shake,3px)),calc(.8 * var(--shake,3px)))}20%{transform:translate(calc(.9 * var(--shake,3px)),calc(-.3 * var(--shake,3px)))}30%{transform:translate(calc(-.4 * var(--shake,3px)),calc(-1 * var(--shake,3px)))}40%{transform:translate(var(--shake,3px),calc(.3 * var(--shake,3px)))}50%{transform:translate(calc(-.8 * var(--shake,3px)),0)}60%{transform:translate(calc(.4 * var(--shake,3px)),var(--shake,3px))}70%{transform:translate(calc(.7 * var(--shake,3px)),calc(-.8 * var(--shake,3px)))}80%{transform:translate(calc(-1 * var(--shake,3px)),calc(.4 * var(--shake,3px)))}90%{transform:translate(calc(.5 * var(--shake,3px)),calc(-.5 * var(--shake,3px)))}}@keyframes bounce-settle{0%,20%,40%,60%,80%,100%{animation-timing-function:cubic-bezier(.215,.61,.355,1)}0%{opacity:0;transform:scale3d(.3,.3,.3)}20%{transform:scale3d(1.1,1.1,1.1)}40%{transform:scale3d(.9,.9,.9)}60%{opacity:1;transform:scale3d(1.03,1.03,1.03)}80%{transform:scale3d(.97,.97,.97)}100%{opacity:1;transform:scale3d(1,1,1)}}@keyframes fade-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes float-motion{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.fx-target{animation-duration:var(--fx-duration,.7s)!important;animation-delay:var(--fx-delay,0s)!important;animation-fill-mode:both!important}.fx-shake{animation-name:random-shake;animation-timing-function:steps(1,end);animation-iteration-count:infinite}.fx-bounce{animation-name:bounce-settle;animation-timing-function:ease-out;animation-iteratio <main class="wrap" id="app"><div class="meta"><input id="title" placeholder="SSタイトル"><input id="series" placeholder="作品・シリーズ名"></div><div class="layout"><section><div class="paper"><div id="blocks"></div><div class="insert"><button data-add="text">＋文章</button><button data-add="dialogue">＋会話</button><button data-add="image">＋スチル</button><button data-add="html">＋HTML</button></div></div></section><aside class="sidebar"><details open><summary>全体設定</summary><div class="section-pad"><label>全体の文字色</label><input type="color" id="globaltext" value="#25332e"><label>背景色</label><input type="color" id="globalbg" value="#ffffff"><label>本文フォント</label><select id="fontchoice"><option value="Shippori Antique">Shippori Antique</option><option value="Zen Kaku Gothic New">Zen Kaku Gothic New</option><option value="custom">カスタム</option></select><label>全体フォントの太さ</label><select id="fontweight"><option value="100">100</option><option value="200">200</option><option value="300">300</option><option value="400">400</option><option value="500">500</option><option value="600">600</option><option value="700">700</option><option value="800">800</option><option value="900">900</option></select><label>カスタムフォント名</label><input id="fontfamily" placeholder="フォント名"><label>Google Fonts @import / link</label><textarea id="fontimport" spellcheck="false"></textarea></div></details><details open><summary>ブロック設定</summary><div class="section-pad"><div id="empty" class="hint">編集するブロックを選択してね。</div><div id="settings" class="hidden"><label>演出対象</label><select id="target"><option value="whole">ブロック全体</option><option value="text">文字だけ</option><option value="avatar">アイコンだけ</option></select><label>アニメーション</label><select id="effect"><option value="none">なし</option><option value="fade">フェードイン</option><option value="shake">ランダム方向に震える</option><option value="float">浮遊</option></select><div class="row"><div><label>時間（秒）</label><input id="duration" type="number" min=".1" max="20" step=".1"></div><div><label>遅延（秒）</label><input id="delay" type="number" min="0" max="20" step=".1"></div></div><label><input id="loop" type="checkbox"> ループ再生</label><label>配置</label><select id="alignblock"><option value="left">左揃え</option><option value="center">中央揃え</option><option value="right">右揃え</option></select><label>震えの強さ（移動幅 px）</label><input id="shake" type="range" min="0" max="20" step=".5"><span id="shakevalue" class="hint"></span><label>ブロック文字サイズ（px）</label><input id="blocksize" type="number" min="8" max="120" placeholder="標準 16"><div id="characterFields" class="hidden"><details open><summary>キャラクター</summary><div class="section-pad"><label>登録済みキャラを呼び出す</label><select id="characterSelect"></select><label>アイコン位置</label><select id="avatarposition"><option value="left">左側</option><option value="right">右側</option></select><label>差分を選択</label><select id="variantSelect"></select><label>新しい差分名</label><input id="variantName" placeholder="例：笑顔・驚き"><button id="saveVariant">現在のアイコンを差分として保存</button><label>キャラ名</label><input id="speaker" placeholder="名前"><label>アイコン画像</label><input id="avatarfile" type="file" accept="image/*"><div class="row"><div><label>アイコン背景色</label><input id="avatarbg" type="color"></div><div><label>名前色</label><input id="namecolor" type="color"></div></div><label>アイコンの大きさ（px）</label><input id="avatarsize" type="number" min="30" max="220"><label>名前の大きさ（px・長い場合は自動縮小）</label><input id="namesize" type="number" min="10" max="70"><button id="register" style="margin-top:9px;width:100%">このキャラを登録・更新</button><p class="hint">登録したキャラは別の会話ブロックでも選べるぞ。</p></div></details></div><div id="imageFields" class="hidden"><label>スチル画像</label><input id="stillfile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><p class="hint">PNG / JPEG / WebP / GIF（アニメーションGIF対応）</p><label>スチル表示幅（px）</label><input id="stillwidth" type="number" min="40" max="2000" value="640"></div><details><summary>ブロックのフォント</summary><div class="section-pad"><label>フォント</label><select id="blockfont"><option value="">全体設定に従う</option><option value="Shippori Antique">Shippori Antique</option><option value="Zen Kaku Gothic New">Zen Kaku Gothic New</option><option value="custom">カスタムフォント名</option></select><label>カスタムフォント名</label><input id="blockfontcustom" placeholder="フォント名"><label>ウェイト</label><select id="blockweight"><option value="">全体設定に従う</option><option value="100">100</option><option value="200">200</option><option value="300">300</option><option value="400">400</option><option value="500">500</option><option value="600">600</option><option value="700">700</option><option value="800">800</option><option value="900">900</option></select><button id="savefont">このフォント設定を登録</button><label>SS内のフォント設定</label><select id="fontlibrary"></select></div></details><hr><h3>カスタムCSSアニメーション</h3><label>追加CSS（@keyframes を含めて記述）</label><textarea id="customcss" spellcheck="false" placeholder="@keyframes myMove { ... }"></textarea><label>選択ブロックのアニメーション名</label><input id="customname" placeholder="例: myMove"><button id="applycustom" style="margin-top:8px">CSS演出を適用</button><p class="custom-note">CSSはプレビューにも反映。自分で書いた信頼できるCSSだけを使ってね。ループ・時間・遅延設定も使える。</p><hr><p class="hint">試作版：保存はこの端末のブラウザ。画像はJSONにも含まれる。公開URL・R2・Firebaseは未対応。</p></div></div></details></aside></div></main><input id="inlinefile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><input id="jsonfile" type="file" accept=".json,application/json" hidden><style id="usercss"></style><style id="fontcss"></style>
<script>
const $=id=>document.getElementById(id), KEY='ss-studio-v04', OLD='ss-studio-v03';let data={title:'',series:'',blocks:[{id:1,type:'text',text:'ここから物語を書こう。',effect:'none'}],characters:[],fontLibrary:[],globalText:'#25332e',globalBg:'#ffffff',customCSS:'',fontImport:'',fontChoice:"Zen Kaku Gothic New",fontFamily:'Zen Kaku Gothic New',fontWeight:400},selected=1,nextId=2,preview=false,observer=null,savedRange=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function clean(s){const d=document.createElement('div');d.innerHTML=String(s||'');d.querySelectorAll('script,style,iframe,object,embed,svg,math').forEach(n=>n.remove());d.querySelectorAll('*').forEach(n=>{if(n.tagName==='IMG'){let src=n.getAttribute('src')||'';if(!/^(data:image\/(png|jpeg|webp|gif);base64,|https:\/\/)/i.test(src)){n.remove();return}let width=n.getAttribute('width')||parseInt(n.style.width)||null;for(const a of [...n.attributes])n.removeAttribute(a.name);n.setAttribute('src',src);n.className='inline-img';if(width&&/^\d+$/.test(width))n.style.width=Math.min(2000,Number(width))+'px';return}if(!['B','STRONG','I','EM','U','S','STRIKE','SPAN','FONT','BR','DIV','P'].includes(n.tagName)){n.replaceWith(...n.childNodes);return}for(const a of [...n.attributes])if(a.name!=='class'&&a.name!=='style'&&a.name!=='color')n.removeAttribute(a.name);n.className=[...n.classList].filter(c=>['partial-shake','partial-bounce','partial-fade'].includes(c)).join(' ');let css=n.style.cssText;n.removeAttribute('style');for(const prop of ['color','font-size','font-family','font-weight','font-style','text-decoration']){let v=document.createElement('span');v.style.setProperty(prop,css&&(()=>{let t=document.createElement('span');t.style.cssText=css;return t.style.getPropertyValue(prop)})());if(v.style.getPropertyValue(prop))n.style.setProperty(prop,v.style.getPropertyValue(prop))}});return d.innerHTML}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='保存済み'}catch(e){$('status').textContent='容量不足：JSON保存してね'}}
function sync(){document.querySelectorAll('.block').forEach(el=>{let b=data.blocks.find(x=>x.id==el.dataset.id);let ed=el.querySelector('.editable');if(b&&ed)b.text=clean(ed.innerHTML)});data.title=$('title').value;data.series=$('series').value;persist()}
function defaultAvatar(){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#d8e8df"/><circle cx="50" cy="36" r="19" fill="#8bbbab"/><path d="M12 100Q15 62 50 62Q85 62 88 100" fill="#8bbbab"/></svg>')}
function effectClass(b){return 'fx-'+(['fade','bounce','shake','float'].includes(b.effect)?b.effect:'none')}
function render(){applyFont();if(observer)observer.disconnect();$('title').value=data.title||'';$('series').value=data.series||'';$('blocks').innerHTML='';$('usercss').textContent=data.customCSS||'';if(preview)$('blocks').insertAdjacentHTML('beforeend',`<div class="reader-series">${esc(data.series)}</div><div class="reader-title">${esc(data.title||'無題のSS')}</div>`);
data.blocks.forEach(b=>{let el=document.createElement('article');el.className='block'+(!preview&&b.id===selected?' selected':'');el.dataset.id=b.id;let tools=document.createElement('div');tools.className='block-tools';tools.innerHTML='<button data-act="up">↑</button><button data-act="down">↓</button><button data-act="clone">複製</button><button data-act="delete">削除</button>';el.append(tools);
el.style.textAlign=b.align||'left';el.style.setProperty('--story-font',blockFont(b));el.style.setProperty('--story-weight',b.blockWeight||data.fontWeight||400);
if(b.type==='image')el.insertAdjacentHTML('beforeend',b.src?`<img class="still" style="width:${Math.max(40,Math.min(2000,Number(b.stillWidth)||640))}px" src="${esc(b.src)}" alt="スチル">`:'<div class="placeholder">右側からスチルを追加</div>');
else if(b.type==='html'){if(preview){let frame=document.createElement('iframe');frame.className='html-frame';frame.setAttribute('sandbox','');frame.setAttribute('referrerpolicy','no-referrer');frame.srcdoc=String(b.html||'');el.append(frame)}else{let ta=document.createElement('textarea');ta.className='html-code';ta.placeholder='HTMLを入力（プレビューは隔離されたiframeで表示）';ta.value=b.html||'';ta.addEventListener('input',()=>{b.html=ta.value;persist()});el.append(ta)}}
else if(b.type==='dialogue'){el.insertAdjacentHTML('beforeend',`<div class="dialogue ${b.avatarPosition==='right'?'avatar-right':''}"><div class="character" style="--avatar-size:${Number(b.avatarSize)||66}px;--name-size:${Number(b.nameSize)||22}px;--avatar-bg:${esc(b.avatarBg||'#d8e8df')};--name-color:${esc(b.nameColor||'#65a897')}"><img class="avatar" src="${esc(b.avatar||defaultAvatar())}" alt=""><div class="speaker" data-speaker="${esc(b.speaker||'キャラクター')}">${esc(b.speaker||'キャラクター')}</div></div><div class="dialogue-text" style="--block-align:${esc(b.align||'left')};--avatar-size:${Number(b.avatarSize)||66}px;--first-line-height:${(Number(b.fontSize)||16)*1.3}px"><div class="editable" data-placeholder="セリフを入力" style="font-size:${Number(b.fontSize)||16}px" ${preview?'':'contenteditable="true"'}>${clean(b.text)}</div></div></div>`)}
else el.insertAdjacentHTML('beforeend',`<div class="editable" data-placeholder="文章を入力" style="font-size:${Number(b.fontSize)||16}px" ${preview?'':'contenteditable="true"'}>${clean(b.text)}</div>`);
