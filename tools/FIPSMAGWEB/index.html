<style>

.block{position:relative;padding:10px;margin:12px 0;border:1px solid transparent;border-radius:9px}.block.selected{border-color:var(--accent);background:#f6faf8}.block-tools{display:none;position:absolute;right:4px;top:-25px;gap:4px;z-index:2}.block.selected .block-tools,.block:hover .block-tools{display:flex}.block-tools button{font-size:11px;padding:2px 6px}.editable{min-height:28px;outline:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}.editable:empty:before{content:attr(data-placeholder);color:#9caea5}.dialogue{display:flex;gap:14px;align-items:flex-start}.character{width:var(--avatar-size,66px);flex-shrink:0;text-align:center}.avatar{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;background:var(--avatar-bg,#d8e8df)}.speaker{font-size:12px;font-weight:700;line-height:1.4;margin-top:5px;color:var(--name-color,var(--accent));overflow-wrap:anywhere}.dialogue-text{flex:1;min-width:0}.still{display:block;max-width:100%;max-height:500px;margin:auto;object-fit:contain}.placeholder{background:#eef5f1;padding:45px;text-align:center;color:#82978b}.insert{display:flex;gap:8px;margin:14px 0}.insert button{flex:1}.hidden{display:none!important}.partial-shake{display:inline-block;animation:random-shake .32s steps(1,end) infinite}.partial-bounce{display:inline-block;animation:bounce-settle .85s ease-out both}.partial-fade{display:inline-block;animation:fade-in .65s ease both}@keyframes random-shake{0%,100%{transform:translate(0,0) rotate(0)}10%{transform:translate(-2px,2px) rotate(-2deg)}20%{transform:translate(2px,-1px) rotate(1deg)}30%{transform:translate(-1px,-2px) rotate(-1deg)}40%{transform:translate(3px,1px) rotate(2deg)}50%{transform:translate(-2px,0) rotate(0)}60%{transform:translate(1px,3px) rotate(-2deg)}70%{transform:translate(2px,-2px) rotate(1deg)}80%{transform:translate(-3px,1px) rotate(2deg)}90%{transform:translate(1px,-1px) rotate(-1deg)}}@keyframes bounce-settle{0%{transform:scale(1.45,.68)}23%{transform:scale(.86,1.1 </style></head><body><header><div class="top"><strong>SS Studio <span class="hint">v0.2</span></strong><div class="actions"><span id="status" class="status">ローカル保存</span><button id="mode">プレビュー</button><button id="export">JSON保存</button><button id="import">JSON読込</button><button id="reset">新規</button><button id="save" class="primary">保存</button></div></div><div class="formatbar" id="formatbar"><span class="hint">文字選択 →</span><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><input type="color" id="color" value="#db6262" title="文字色"><select id="fontpreset" title="文字サイズ"><option value="">文字サイズ</option><option value="12">小 12</option><option value="16">標準 16</option><option value="20">大 20</option><option value="28">特大 28</option><option value="36">巨大 36</option></select><input type="number" id="fontsize" min="8" max="120" placeholder="px" title="任意サイズ"><button id="applysize">サイズ適用</button><select id="partialfx"><option value="partial-shake">震える</option><option value="partial-bounce">バイン</option><option value="partial-fade">フェード</option></select><button id="applyfx">選択範囲に演出</button><button id="clearfx">部分演出解除</button></div></header>
<main class="wrap" id="app"><div class="meta"><input id="title" placeholder="SSタイトル"><input id="series" placeholder="作品・シリーズ名"></div><div class="layout"><section><div class="paper"><div id="blocks"></div><div class="insert"><button data-add="text">＋文章</button><button data-add="dialogue">＋会話</button><button data-add="image">＋スチル</button></div></div></section><aside class="sidebar"><h3>ブロック設定</h3><div id="empty" class="hint">編集するブロックを選択してね。</div><div id="settings" class="hidden"><label>演出対象</label><select id="target"><option value="whole">ブロック全体</option><option value="text">文字だけ</option><option value="avatar">アイコンだけ</option></select><label>アニメーション</label><select id="effect"><option value="none">なし</option><option value="fade">フェードイン</option><option value="bounce">バイン（減衰）</option><option value="shake">ランダム方向に震える</option><option value="float">浮遊</option></select><div class="row"><div><label>時間（秒）</label><input id="duration" type="number" min=".1" max="20" step=".1"></div><div><label>遅延（秒）</label><input id="delay" type="number" min="0" max="20" step=".1"></div></div><label><input id="loop" type="checkbox"> ループ再生</label><label>ブロック文字サイズ（px）</label><input id="blocksize" type="number" min="8" max="120" placeholder="標準 16"><div id="characterFields" class="hidden"><hr><h3>キャラクター</h3><label>登録済みキャラを呼び出す</label><select id="characterSelect"></select><label>キャラ名</label><input id="speaker" placeholder="名前"><label>アイコン画像</label><input id="avatarfile" type="file" accept="image/*"><div class="row"><div><label>アイコン背景色</label><input id="avatarbg" type="color"></div><div><label>名前色</label><input id="namecolor" type="color"></div></div><label>アイコンの大きさ（px）</label><input id="avatarsize" type="number" min="30" max="220"><button id="register" style="margin-top:9px;width:100%">このキャラを登録・更新</button><p class="hint">登録したキャラは別の会話ブロックでも選べるぞ。</p></div><div id="imageFields" class="hidden"><label>スチル画像</label><input id="stillfile" type="file" accept="image/*"></div><hr><h3>カスタムCSSアニメーション</h3><label>追加CSS（@keyframes を含めて記述）</label><textarea id="customcss" spellcheck="false" placeholder="@keyframes myMove { ... }"></textarea><label>選択ブロックのアニメーション名</label><input id="customname" placeholder="例: myMove"><button id="applycustom" style="margin-top:8px">CSS演出を適用</button><p class="custom-note">CSSはプレビューにも反映。自分で書いた信頼できるCSSだけを使ってね。ループ・時間・遅延設定も使える。</p><hr><p class="hint">試作版：保存はこの端末のブラウザ。画像はJSONにも含まれる。公開URL・R2・Firebaseは未対応。</p></div></aside></div></main><input id="jsonfile" type="file" accept=".json,application/json" hidden><style id="usercss"></style>
<script>
const $=id=>document.getElementById(id), KEY='ss-studio-v02', OLD='ss-studio-v01';let data={title:'',series:'',blocks:[{id:1,type:'text',text:'ここから物語を書こう。',effect:'none'}],characters:[],customCSS:''},selected=1,nextId=2,preview=false,observer=null,savedRange=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function clean(s){const d=document.createElement('div');d.innerHTML=String(s||'');d.querySelectorAll('script,style,iframe,object,embed,svg,math').forEach(n=>n.remove());d.querySelectorAll('*').forEach(n=>{if(!['B','STRONG','I','EM','U','S','STRIKE','SPAN','FONT','BR','DIV','P'].includes(n.tagName)){n.replaceWith(...n.childNodes);return}for(const a of [...n.attributes])if(a.name!=='class'&&a.name!=='style'&&a.name!=='color')n.removeAttribute(a.name);n.className=[...n.classList].filter(c=>['partial-shake','partial-bounce','partial-fade'].includes(c)).join(' ');let css=n.style.cssText;n.removeAttribute('style');for(const prop of ['color','font-size','font-weight','font-style','text-decoration']){let v=document.createElement('span');v.style.setProperty(prop,css&&(()=>{let t=document.createElement('span');t.style.cssText=css;return t.style.getPropertyValue(prop)})());if(v.style.getPropertyValue(prop))n.style.setProperty(prop,v.style.getPropertyValue(prop))}});return d.innerHTML}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='保存済み'}catch(e){$('status').textContent='容量不足：JSON保存してね'}}
function sync(){document.querySelectorAll('.block').forEach(el=>{let b=data.blocks.find(x=>x.id==el.dataset.id);let ed=el.querySelector('.editable');if(b&&ed)b.text=clean(ed.innerHTML)});data.title=$('title').value;data.series=$('series').value;persist()}
function defaultAvatar(){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#d8e8df"/><circle cx="50" cy="36" r="19" fill="#8bbbab"/><path d="M12 100Q15 62 50 62Q85 62 88 100" fill="#8bbbab"/></svg>')}
function effectClass(b){return 'fx-'+(['fade','bounce','shake','float'].includes(b.effect)?b.effect:'none')}
function render(){if(observer)observer.disconnect();$('title').value=data.title||'';$('series').value=data.series||'';$('blocks').innerHTML='';$('usercss').textContent=data.customCSS||'';if(preview)$('blocks').insertAdjacentHTML('beforeend',`<div class="reader-series">${esc(data.series)}</div><div class="reader-title">${esc(data.title||'無題のSS')}</div>`);
data.blocks.forEach(b=>{let el=document.createElement('article');el.className='block'+(!preview&&b.id===selected?' selected':'');el.dataset.id=b.id;let tools=document.createElement('div');tools.className='block-tools';tools.innerHTML='<button data-act="up">↑</button><button data-act="down">↓</button><button data-act="clone">複製</button><button data-act="delete">削除</button>';el.append(tools);
if(b.type==='image')el.insertAdjacentHTML('beforeend',b.src?`<img class="still" src="${esc(b.src)}" alt="スチル">`:'<div class="placeholder">右側からスチルを追加</div>');
else if(b.type==='dialogue'){el.insertAdjacentHTML('beforeend',`<div class="dialogue"><div class="character" style="--avatar-size:${Number(b.avatarSize)||66}px;--avatar-bg:${esc(b.avatarBg||'#d8e8df')};--name-color:${esc(b.nameColor||'#65a897')}"><img class="avatar" src="${esc(b.avatar||defaultAvatar())}" alt=""><div class="speaker">${esc(b.speaker||'キャラクター')}</div></div><div class="dialogue-text"><div class="editable" data-placeholder="セリフを入力" style="font-size:${Number(b.fontSize)||16}px" ${preview?'':'contenteditable="true"'}>${clean(b.text)}</div></div></div>`)}
else el.insertAdjacentHTML('beforeend',`<div class="editable" data-placeholder="文章を入力" style="font-size:${Number(b.fontSize)||16}px" ${preview?'':'contenteditable="true"'}>${clean(b.text)}</div>`);
if(preview){let target=(b.target==='avatar'&&b.type==='dialogue')?el.querySelector('.character'):(b.target==='text'&&b.type!=='image')?el.querySelector('.editable'):el;target.classList.add('fx-target',effectClass(b));target.style.setProperty('--fx-duration',(Number(b.duration)||.7)+'s');target.style.setProperty('--fx-delay',(Number(b.delay)||0)+'s');target.style.animationIterationCount=b.loop?'infinite':'1';if(b.effect==='custom'&&b.customName){target.classList.remove('fx-none');target.style.animationName=b.customName;target.style.animationTimingFunction='ease';target.style.animationFillMode='both';target.style.animationIterationCount=b.loop?'infinite':'1'}el._target=target}
el.addEventListener('click',e=>{if(preview)return;let act=e.target.closest('[data-act]');if(act){sync();let i=data.blocks.findIndex(x=>x.id===b.id);if(act.dataset.act==='delete'){data.blocks.splice(i,1);selected=data.blocks[0]?.id||null}else if(act.dataset.act==='clone'){let c={...b,id:nextId++};data.blocks.splice(i+1,0,c);selected=c.id}else if(act.dataset.act==='up'&&i>0)[data.blocks[i-1],data.blocks[i]]=[data.blocks[i],data.blocks[i-1]];else if(act.dataset.act==='down'&&i<data.blocks.length-1)[data.blocks[i+1],data.blocks[i]]=[data.blocks[i],data.blocks[i+1]];persist();render();return}if(selected!==b.id){selected=b.id;document.querySelectorAll('.block').forEach(x=>x.classList.toggle('selected',+x.dataset.id===selected));settings()}});
el.addEventListener('input',()=>{let ed=el.querySelector('.editable');if(ed){b.text=clean(ed.innerHTML);persist()}});$('blocks').append(el)});
settings();if(preview){observer=new IntersectionObserver(entries=>{entries.forEach(e=>{let t=e.target._target;if(e.isIntersecting){t.classList.add('seen');t.classList.remove('paused');if(!data.blocks.find(b=>b.id==e.target.dataset.id)?.loop)observer.unobserve(e.target)}else if(t.classList.contains('seen'))t.classList.add('paused')})},{threshold:.1});document.querySelectorAll('.block').forEach(el=>observer.observe(el))}}
function settings(){let b=data.blocks.find(x=>x.id===selected);$('empty').classList.toggle('hidden',!!b);$('settings').classList.toggle('hidden',!b);if(!b)return;$('target').value=b.target||'whole';$('target').querySelector('option[value="avatar"]').disabled=b.type!=='dialogue';$('target').querySelector('option[value="text"]').disabled=b.type==='image';$('effect').value=b.effect==='custom'?'none':b.effect||'none';$('duration').value=b.duration??.7;$('delay').value=b.delay??0;$('loop').checked=b.loop??['shake','float'].includes(b.effect);$('blocksize').value=b.fontSize||16;$('characterFields').classList.toggle('hidden',b.type!=='dialogue');$('imageFields').classList.toggle('hidden',b.type!=='image');$('customcss').value=data.customCSS||'';$('customname').value=b.customName||'';if(b.type==='dialogue'){$('speaker').value=b.speaker||'';$('avatarbg').value=b.avatarBg||'#d8e8df';$('namecolor').value=b.nameColor||'#65a897';$('avatarsize').value=b.avatarSize||66;let sel=$('characterSelect');sel.innerHTML='<option value="">登録済みキャラを選択</option>'+data.characters.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join('')}}
function add(type){sync();let b={id:nextId++,type,text:'',effect:'none',fontSize:16};if(type==='dialogue'){Object.assign(b,{speaker:'キャラクター',avatarSize:66,avatarBg:'#d8e8df',nameColor:'#65a897'})}data.blocks.push(b);selected=b.id;persist();render();document.querySelector('.block:last-child')?.scrollIntoView({behavior:'smooth',block:'center'})}
document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>add(x.dataset.add));$('title').oninput=sync;$('series').oninput=sync;
for(const id of ['target','effect','duration','delay','loop','blocksize','speaker','avatarbg','namecolor','avatarsize'])$(id).addEventListener('change',e=>{let b=data.blocks.find(x=>x.id===selected);if(!b)return;let field={blocksize:'fontSize',avatarbg:'avatarBg',namecolor:'nameColor',avatarsize:'avatarSize'}[id]||id;b[field]=id==='loop'?e.target.checked:['duration','delay','blocksize','avatarsize'].includes(id)?Number(e.target.value):e.target.value;if(id==='effect'){b.loop=['shake','float'].includes(b.effect);b.duration=b.effect==='bounce'?.85:b.effect==='shake'?.32:.7}persist();render()});
$('characterSelect').onchange=e=>{let c=data.characters[Number(e.target.value)],b=data.blocks.find(x=>x.id===selected);if(!c||!b)return;Object.assign(b,{speaker:c.name,avatar:c.avatar,avatarBg:c.avatarBg,nameColor:c.nameColor,avatarSize:c.avatarSize});persist();render()};
$('register').onclick=()=>{let b=data.blocks.find(x=>x.id===selected);if(!b||!b.speaker?.trim())return alert('キャラ名を入れてね');let c={name:b.speaker,avatar:b.avatar||'',avatarBg:b.avatarBg||'#d8e8df',nameColor:b.nameColor||'#65a897',avatarSize:b.avatarSize||66};let i=data.characters.findIndex(x=>x.name===c.name);if(i>=0)data.characters[i]=c;else data.characters.push(c);persist();settings();alert('キャラを登録したよ！')};
function readImg(f,fn){if(!f)return;let r=new FileReader();r.onload=()=>fn(r.result);r.readAsDataURL(f)}
$('avatarfile').onchange=e=>readImg(e.target.files[0],src=>{let b=data.blocks.find(x=>x.id===selected);b.avatar=src;persist();render()});$('stillfile').onchange=e=>readImg(e.target.files[0],src=>{let b=data.blocks.find(x=>x.id===selected);b.src=src;persist();render()});
$('customcss').oninput=e=>{data.customCSS=e.target.value;$('usercss').textContent=data.customCSS;persist()};$('applycustom').onclick=()=>{let b=data.blocks.find(x=>x.id===selected),name=$('customname').value.trim();if(!b||!/^[a-zA-Z_][\w-]*$/.test(name))return alert('CSSのアニメーション名を入力してね');b.customName=name;b.effect='custom';persist();render()};
$('mode').onclick=()=>{sync();preview=!preview;$('app').classList.toggle('preview',preview);$('mode').textContent=preview?'編集に戻る':'プレビュー';$('formatbar').classList.toggle('hidden',preview);render();window.scrollTo(0,0)};
$('save').onclick=()=>{sync();alert('ブラウザに保存したよ。JSONバックアップもおすすめ！')};$('export').onclick=()=>{sync();let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='ss-'+(data.title||'draft').replace(/[\\/:*?"<>|]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('import').onclick=()=>$('jsonfile').click();$('jsonfile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.blocks))throw Error('不正な形式');data={title:obj.title||'',series:obj.series||'',blocks:obj.blocks.filter(x=>['text','dialogue','image'].includes(x.type)).map((b,i)=>({...b,id:i+1,text:clean(b.text)})),characters:Array.isArray(obj.characters)?obj.characters:[],customCSS:obj.customCSS||''};nextId=data.blocks.length+1;selected=data.blocks[0]?.id||null;persist();render()}catch(err){alert('読込失敗: '+err.message)}e.target.value=''};
$('reset').onclick=()=>{if(!confirm('現在のSSを新規作成で上書きする？ 先にJSON保存をおすすめするよ'))return;data={title:'',series:'',blocks:[{id:1,type:'text',text:'',effect:'none'}],characters:data.characters,customCSS:data.customCSS};selected=1;nextId=2;persist();render()};
document.addEventListener('selectionchange',()=>{let s=window.getSelection();if(s.rangeCount&&!s.isCollapsed){let r=s.getRangeAt(0),node=r.commonAncestorContainer,el=node.nodeType===1?node:node.parentElement;if(el?.closest('.editable'))savedRange=r.cloneRange()}});
function getRange(){let r=savedRange;if(!r)return null;let n=r.commonAncestorContainer,el=n.nodeType===1?n:n.parentElement;return el?.closest('.editable')?r:null}
function restore(){let r=getRange();if(!r)return false;let s=window.getSelection();s.removeAllRanges();s.addRange(r);return true}
function applyInline(cls,style){let r=getRange();if(!r||r.collapsed)return alert('文章の文字を選択してね');restore();let frag=r.extractContents(),span=document.createElement('span');if(cls)span.className=cls;if(style)span.style.cssText=style;span.append(frag);r.insertNode(span);let ed=span.closest('.editable');savedRange=null;window.getSelection().removeAllRanges();if(ed){let b=data.blocks.find(x=>x.id==ed.closest('.block').dataset.id);if(b)b.text=clean(ed.innerHTML)}persist()}
document.querySelectorAll('[data-cmd]').forEach(btn=>{btn.onmousedown=e=>e.preventDefault();btn.onclick=()=>{if(!restore())return alert('文字を選択してね');document.execCommand(btn.dataset.cmd,false,null);let ed=window.getSelection().anchorNode?.parentElement?.closest('.editable');if(ed){let b=data.blocks.find(x=>x.id==ed.closest('.block').dataset.id);b.text=clean(ed.innerHTML);persist()}}});
$('color').oninput=e=>applyInline('',`color:${e.target.value}`);$('fontpreset').onchange=e=>{if(e.target.value)$('fontsize').value=e.target.value};$('applysize').onclick=()=>{let n=Number($('fontsize').value||$('fontpreset').value);if(n>=8&&n<=120)applyInline('',`font-size:${n}px`);else alert('8〜120pxを指定してね')};$('applyfx').onclick=()=>applyInline($('partialfx').value,'');$('clearfx').onclick=()=>{let r=getRange();if(!r)return;let n=r.commonAncestorContainer,el=n.nodeType===1?n:n.parentElement,span=el.closest('.partial-shake,.partial-bounce,.partial-fade');if(!span)return alert('演出付きの文字の内側を選択してね');span.classList.remove('partial-shake','partial-bounce','partial-fade');sync()};
try{let obj=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'null');if(obj?.blocks){data={...data,...obj,characters:obj.characters||[],customCSS:obj.customCSS||''};nextId=Math.max(0,...data.blocks.map(b=>+b.id||0))+1;selected=data.blocks[0]?.id||null}}catch(e){}render();
</script></body></html>
