<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ココフォリアログ整形</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap");
:root{
  --ui-bg:#202124;--ui-panel:#292a2d;--ui-panel2:#323338;--ui-line:#4b4d52;
  --ui-text:#f1f3f4;--ui-sub:#aeb3bb;--accent:#8ab4f8;
  --page-bg:#eeeeee;--page-text:#333333;--bubble:#ffffff;--separator:#333333;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Zen Kaku Gothic New",sans-serif}
body{background:var(--ui-bg);color:var(--ui-text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--ui-line);background:var(--ui-panel2);color:var(--ui-text);padding:8px 10px}
button:hover{background:#3b3d42}
button.primary{background:#365f9b;border-color:#5e88c7}
button.danger{background:#7d3030;border-color:#a34a4a}
input,select,textarea{width:100%;background:#191a1d;color:var(--ui-text);border:1px solid var(--ui-line);padding:8px}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:12px;color:var(--ui-sub);margin:10px 0 5px}
h1,h2,h3{margin:0}
.app{display:grid;grid-template-columns:320px minmax(0,1fr) 390px;height:100vh;min-height:0;overflow:hidden}
.sidebar,.inspector{background:var(--ui-panel);overflow:auto;min-height:0}
.sidebar{border-right:1px solid var(--ui-line);padding:14px}
.inspector{border-left:1px solid var(--ui-line);padding:14px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;gap:7px;align-items:center;padding:10px;border-bottom:1px solid var(--ui-line);background:#242528;flex:none}
.topbar .grow{flex:1}
.topbar h1{font-size:16px}
.tabs{display:flex;gap:5px;overflow:auto;padding:8px;border-bottom:1px solid var(--ui-line);background:#1c1d20}
.tab{white-space:nowrap}
.tab.active{background:#4b6d9e;border-color:#7195ca}
.preview-wrap{flex:1;min-height:0;overflow:auto;padding:28px;background:#151619;-webkit-overflow-scrolling:touch}
.page{max-width:900px;margin:0 auto;background:var(--page-bg);color:var(--page-text);padding:42px 48px 70px;min-height:100%;font-family:"Zen Kaku Gothic New",sans-serif;border-radius:18px}
.preview-title{text-align:center;font-size:38px;font-weight:800;padding:4px 0 18px;border-bottom:4px solid currentColor;margin-bottom:34px}.preview-header-img{display:block;max-width:100%;max-height:420px;object-fit:contain;margin:16px auto 18px}
.block{position:relative;margin:18px 0}
.block.selected{outline:2px solid var(--accent);outline-offset:5px}
.block-tools{display:none;position:absolute;right:0;top:-30px;z-index:4;gap:3px}
.block.selected .block-tools{display:flex}
.block-tools button{font-size:11px;padding:4px 6px}
.speech-row{display:flex;gap:14px;align-items:flex-start}
.speech-row.right{flex-direction:row-reverse}
.avatar{width:56px;height:56px;min-width:56px;object-fit:cover;background:#aaa;display:block}
.speech-content{min-width:0;flex:1}
.speaker{font-weight:800;font-size:18px;line-height:1.25;margin:0 0 5px}
.bubble{position:relative;display:block;padding:12px 18px;min-height:1.65em;background:var(--bubble);color:var(--page-text);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.left-tail:before,.bubble.right-tail:before{content:"";position:absolute;top:16px;border:10px solid transparent}
.bubble.left-tail:before{left:-18px;border-right-color:var(--bubble)}
.bubble.right-tail:before{right:-18px;border-left-color:var(--bubble)}
.bubble.normal{border-radius:20px}
.bubble.thought{border-radius:28px}.bubble.thought.left-tail:before,.bubble.thought.right-tail:before{width:12px;height:12px;border:0;border-radius:50%;top:23px}.bubble.thought.left-tail:before{left:-20px;background:var(--bubble)}.bubble.thought.right-tail:before{right:-20px;background:var(--bubble)}
.bubble.radio{border-radius:0}.bubble.radio.left-tail:before,.bubble.radio.right-tail:before{border:0;width:12px;height:12px;top:16px;background:var(--bubble)}.bubble.radio.left-tail:before{left:-12px}.bubble.radio.right-tail:before{right:-12px}
.bubble.loud{padding:18px 22px;clip-path:polygon(50.00% 0.00%,60.71% 13.54%,77.03% 7.94%,78.72% 25.12%,95.48% 29.23%,87.61% 44.59%,99.49% 57.12%,84.57% 65.79%,87.79% 82.74%,70.54% 81.97%,64.09% 97.97%,50.00% 88.00%,35.91% 97.97%,29.46% 81.97%,12.21% 82.74%,15.43% 65.79%,0.51% 57.12%,12.39% 44.59%,4.52% 29.23%,21.28% 25.12%,22.97% 7.94%,39.29% 13.54%)}
.bubble.loud.left-tail{clip-path:polygon(50.00% 0.00%,60.71% 13.54%,77.03% 7.94%,78.72% 25.12%,95.48% 29.23%,87.61% 44.59%,99.49% 57.12%,84.57% 65.79%,87.79% 82.74%,70.54% 81.97%,64.09% 97.97%,50.00% 88.00%,35.91% 97.97%,29.46% 81.97%,12.21% 82.74%,15.43% 65.79%,-17.49% 57.12%,12.39% 44.59%,4.52% 29.23%,21.28% 25.12%,22.97% 7.94%,39.29% 13.54%)}
.bubble.loud.right-tail{clip-path:polygon(50.00% 0.00%,60.71% 13.54%,77.03% 7.94%,78.72% 25.12%,95.48% 29.23%,87.61% 44.59%,117.49% 57.12%,84.57% 65.79%,87.79% 82.74%,70.54% 81.97%,64.09% 97.97%,50.00% 88.00%,35.91% 97.97%,29.46% 81.97%,12.21% 82.74%,15.43% 65.79%,0.51% 57.12%,12.39% 44.59%,4.52% 29.23%,21.28% 25.12%,22.97% 7.94%,39.29% 13.54%)}
.bubble.right-tail{margin-right:18px}
.bubble.left-tail{margin-left:18px}
.narration{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
.narration.center{text-align:center}.narration.right{text-align:right}
.textbox{padding:18px;background:#b6b6b6;color:#fff;display:flex;gap:18px;align-items:center}
.textbox.reverse{flex-direction:row-reverse}
.textbox-main{flex:1;min-width:0}.textbox-title{font-weight:900;font-size:24px;margin-bottom:8px}.textbox-text{white-space:pre-wrap;line-height:1.65}
.textbox img{width:38%;max-width:300px;max-height:260px;object-fit:contain}
.bgm{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 14px;background:#333;color:#eee}.bgm span{flex:none}.bgm audio{flex:0 1 70%;max-width:560px}
.bgm audio{min-width:180px}
.media img,.media video{display:block;max-width:100%;max-height:600px;margin:auto}
.media audio{width:100%}
.separator{height:4px;background:currentColor;margin:28px 0}
.roll.success,.roll.critical{color:#00a9b3}.roll.failure,.roll.fumble{color:#c74720}
.roll{white-space:pre-wrap;font-weight:700;line-height:1.65}
.section-label{font-size:12px;color:var(--ui-sub);margin:15px 0 6px;text-transform:uppercase}
.panel{background:var(--ui-panel2);border:1px solid var(--ui-line);padding:10px;margin-bottom:10px}
.row{display:flex;gap:6px}.row>*{flex:1}
.list{display:flex;flex-direction:column;gap:5px}
.list-item{display:flex;align-items:center;gap:6px;padding:7px;background:#222428;border:1px solid #3d3f44}
.list-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.small{font-size:11px;color:var(--ui-sub)}
.empty{padding:30px;text-align:center;color:var(--ui-sub)}
.color-row{display:flex;gap:6px;align-items:center}.color-row input[type=color]{width:44px;padding:2px;height:36px}
.check{display:flex;gap:7px;align-items:center;color:var(--ui-text);font-size:13px}.check input{width:auto}
@media(max-width:1100px){.app{grid-template-columns:270px minmax(0,1fr)}.inspector{position:fixed;right:0;top:0;bottom:0;width:min(390px,92vw);z-index:20;box-shadow:-8px 0 30px #0008;transform:translateX(100%);transition:.18s}.inspector.open{transform:none}.page{padding:32px 24px}}
@media(max-width:700px){
  html,body{height:100%;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;min-height:0;overflow:hidden}
  .sidebar{position:relative;top:auto;z-index:10;flex:0 0 45vh;max-height:none;min-height:0;overflow:auto;border:0;border-bottom:1px solid var(--ui-line);padding:12px}
  .main{flex:1 1 auto;height:auto;min-height:0;overflow:hidden}
  .topbar{flex:none}
  .tabs{flex:none}
  .preview-wrap{flex:1;min-height:0;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
  .page{padding:28px 15px 50px}
  .speech-row{gap:9px}.avatar{width:42px;height:42px;min-width:42px}
  .speaker{font-size:15px}.bubble{padding:9px 13px}.preview-title{font-size:28px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <h2>ココフォリアログ整形</h2>
  <div class="section-label">読み込み</div>
  <div class="panel">
    <input id="fileInput" type="file" multiple accept=".html,.htm,.json,.png,.jpg,.jpeg,.webp,.gif,.apng,.mp4,.mov,.wav,.mp3,.ogg,audio/*,video/*,image/*">
    <div class="small" style="margin-top:7px">HTML(新/旧)・JSON・画像/動画/音声を読み込めます。画像等は挿入素材として登録します。</div>
  </div>
  <div class="row">
    <button id="addTab">タブ追加</button>
    <button id="mergeTabs">全タブ結合</button>
  </div>
  <div class="section-label">タブ</div>
  <div class="panel">
    <div class="small" style="margin-bottom:7px">チェックしたタブをまとめて操作できます。</div>
    <div class="row">
      <button id="mergeSelected">選択して結合</button>
      <button id="deleteSelected" class="danger">選択して削除</button>
    </div>
  </div>
  <div id="tabList" class="list"></div>
  <div class="section-label">ブロック追加</div>
  <div class="panel">
    <div class="row">
      <button data-add="narration">地の文</button>
      <button data-add="bubble">吹き出し</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button data-add="textbox">テキストボックス</button>
      <button data-add="separator">区切り線</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button data-add="media">画像/動画/音声</button>
      <button data-add="bgm">BGM</button>
    </div>
  </div>
  <div class="section-label">キャラクター</div>
  <div class="panel"><div class="row"><button id="mergeCharsSelected">選択して結合</button><button id="deleteCharsSelected" class="danger">選択して削除</button></div></div><div id="charList" class="list"></div>
  <button id="addChar" style="width:100%;margin-top:6px">＋ キャラクター追加</button>
  <div class="section-label">保存</div>
  <div class="row"><button id="backupExport">バックアップ書出</button><button id="backupImport">バックアップ読込</button></div>
  <input id="backupInput" type="file" accept=".json" hidden>
  <button id="reset" class="danger" style="width:100%;margin-top:6px">データリセット</button>
</aside>

<main class="main">
  <div class="topbar">
    <h1 id="activeName">プレビュー</h1><div class="grow"></div>
    <button id="settingsBtn">全体設定</button>
    <button id="exportBtn" class="primary">HTML/ZIP書出</button>
    <button id="inspectorBtn">編集</button>
  </div>
  <div id="tabs" class="tabs"></div>
  <div class="preview-wrap"><div id="page" class="page"></div></div>
</main>

<aside id="inspector" class="inspector">
  <h2 id="inspectorTitle">編集</h2>
  <div id="inspectorBody"></div>
</aside>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
const defaultSettings={
  title:"タイトル",titleColor:"#333333",titleLineColor:"#333333",headerImage:null,
  pageBg:"#eeeeee",rootBg:"#777777",logBg:"#eeeeee",
  baseText:"#333333",baseBubble:"#ffffff",
  baseNarrationText:"#333333",
  baseBoxColor:"#aaaaaa",baseBoxText:"#ffffff",
  baseBgmBg:"#333333",baseBgmText:"#eeeeee",
  baseIconBg:"#aaaaaa",
  separatorColor:"#333333",
  font:'"Zen Kaku Gothic New",sans-serif',
  colors:{system:"#666666",success:"#00a9b3",failure:"#c74720"}
};
// ダイス結果判定：吹き出し本文の末尾が成功/失敗系のキーワードで終わっている場合に判定する。
// 「成功・スペシャル・決定的成功・決定的成功/スペシャル」は成功色、「失敗・致命的失敗」は失敗色に統一する。
function detectRollResult(text){
  const t=String(text||"").replace(/\s+$/,"");
  const m=t.match(/＞\s*(決定的成功\/スペシャル|決定的成功|スペシャル|成功|致命的失敗|失敗)\s*$/);
  if(!m)return null;
  return /失敗/.test(m[1])?"failure":"success";
}
let state={settings:defaultSettings,characters:{},tabs:[],allOnly:{id:"__ALL__",blocks:[]},activeTab:null,lastSingleTab:null,selected:null,media:{},templates:{bubble:[],narration:[],textbox:[]}};

function newTab(name="ログ"){
  const t={id:uid(),name,blocks:[]}; state.tabs.push(t); state.activeTab=t.id; state.lastSingleTab=t.id; return t;
}
function getTab(){return state.tabs.find(t=>t.id===state.activeTab)||state.tabs[0]}
function isAllTab(){return state.activeTab==="__ALL__"}
// ALL表示中に要素を追加した場合、個別タブではなくALL専用の領域(state.allOnly)に追加する。
// これはどの個別タブにも属さず、ALL（全タブ表示）にのみ表示・出力される。
function editTargetTab(){
  if(!isAllTab())return getTab();
  return state.allOnly;
}
function getDisplayBlocks(){
  if(!isAllTab()){const t=getTab();return t?(t.blocks.map(b=>({block:b,tabId:t.id}))):[]}
  return state.tabs.flatMap(t=>t.blocks.map(b=>({block:b,tabId:t.id})))
    .concat(state.allOnly.blocks.map(b=>({block:b,tabId:"__ALL__"})))
    .sort((a,b)=>(Number(a.block.createdAt)||0)-(Number(b.block.createdAt)||0));
}
function findBlock(id){
  for(const t of state.tabs){const b=t.blocks.find(x=>x.id===id);if(b)return {block:b,tab:t,index:t.blocks.indexOf(b)}}
  const b=state.allOnly.blocks.find(x=>x.id===id);if(b)return {block:b,tab:state.allOnly,index:state.allOnly.blocks.indexOf(b)};
  return null;
}
function charFor(name,color,icon){
  const key=String(name||"").trim();
  if(!key||key==="system"||key==="　") return null;
  if(!state.characters[key]) state.characters[key]={id:uid(),name:key,nameColor:color||"#333333",textColor:state.settings.baseText,icon:icon||null,iconBg:state.settings.baseIconBg,narration:false,expressions:[]};
  else if(icon&&!state.characters[key].icon) state.characters[key].icon=icon;
  return state.characters[key];
}
function makeBlock(type,data={}){
  const s=state.settings;
  const textColor=type==="textbox"?s.baseBoxText:type==="narration"?s.baseNarrationText:type==="bgm"?s.baseBgmText:s.baseText;
  return Object.assign({id:uid(),type,createdAt:Date.now(),text:"",name:"",nameColor:"#333333",textColor,bubbleColor:s.baseBubble,direction:"left",shape:"normal",size:"normal",fontWeight:"400",showName:true,align:"left",boxColor:s.baseBoxColor,bgColor:s.baseBgmBg,title:"",image:null,media:null,mediaKind:"image",imageSide:"right",srcTab:null},data);
}
function save(){try{localStorage.setItem("cocofolia_formatter_v1",JSON.stringify(state))}catch(e){console.warn(e)}}
function load(){
  try{
    const x=localStorage.getItem("cocofolia_formatter_v1");
    if(x){
      state=JSON.parse(x);
      state.settings=Object.assign(clone(defaultSettings),state.settings||{});
      state.settings.colors=Object.assign(clone(defaultSettings.colors),state.settings.colors||{});
      state.characters=state.characters||{};Object.values(state.characters).forEach(c=>{c.expressions=c.expressions||[];c.iconBg=c.iconBg||state.settings.baseIconBg});
      state.tabs=state.tabs||[];state.tabs.forEach(t=>t.blocks.forEach(b=>{b.fontWeight=b.fontWeight||"400"}));
      if(!state.tabs.length)newTab();
      state.allOnly=state.allOnly||{id:"__ALL__",blocks:[]};state.allOnly.id="__ALL__";state.allOnly.blocks=state.allOnly.blocks||[];
      state.allOnly.blocks.forEach(b=>{b.fontWeight=b.fontWeight||"400"});
      if(!state.tabs.some(t=>t.id===state.lastSingleTab))state.lastSingleTab=state.tabs[0]?.id||null;
      state.templates=state.templates||{bubble:[],narration:[],textbox:[]};
      return true
    }
  }catch(e){}
  newTab();return false
}
function sizeClass(s){return ({h1:"h1",h2:"h2",h3:"h3",normal:"normal",small:"small"})[s]||"normal"}
function fontSize(s){return ({h1:"2.1em",h2:"1.7em",h3:"1.35em",normal:"1em",small:".78em"})[s]||"1em"}
function effectiveBlock(b,key,fallback){
  const defs={nameColor:"#333333",textColor:defaultSettings.baseText,bubbleColor:defaultSettings.baseBubble};
  return b[key]===defs[key] ? (fallback??b[key]) : b[key];
}
function effectiveChar(c,key,fallback){
  const v=c?.[key];
  return (v==="#333333" || v==null) ? (fallback??v) : v;
}
// 全体設定・キャラクター設定の色を変更した際、既存ブロックの色が変更前の値と一致していれば
// 一緒に追従させる（name指定時はそのキャラクターの名前のブロックのみ対象、blockType指定時はその種類のブロックのみ対象）。
function syncColorField(field,oldVal,newVal,name,blockType){
  if(!oldVal||!newVal||oldVal===newVal)return;
  const apply=b=>{
    if(blockType&&b.type!==blockType)return;
    if(name!=null&&b.name!==name)return;
    if(b[field]===oldVal)b[field]=newVal;
  };
  state.tabs.forEach(t=>t.blocks.forEach(apply));
  state.allOnly.blocks.forEach(apply);
}
// テキストボックス⇔地の文/吹き出し の相互変換。
// ・地の文/吹き出し → テキストボックス：名前をタイトルへ移し、名前色は引き継がない（本文色は基準本文色にリセット）。
// ・テキストボックス → 地の文/吹き出し：タイトルを名前へ戻し、画像は消す。
// アイコン背景色の全体設定変更を、個別設定していないキャラクター（値が一致するキャラクター）に反映する。
function syncCharIconBg(oldVal,newVal){
  if(!oldVal||!newVal||oldVal===newVal)return;
  Object.values(state.characters).forEach(c=>{if(c.iconBg===oldVal)c.iconBg=newVal});
}
function convertBlockType(b,newType){
  if(newType==="textbox"&&b.type!=="textbox"){
    b.title=b.name||b.title||"";
    b.name="";
    b.textColor=state.settings.baseBoxText;
    b.boxColor=b.boxColor&&b.boxColor!=="#333333"?b.boxColor:state.settings.baseBoxColor;
  }else if(b.type==="textbox"&&newType!=="textbox"){
    b.name=b.title||b.name||"";
    b.image=null;
    b.textColor=newType==="narration"?state.settings.baseNarrationText:state.settings.baseText;
  }
  b.type=newType;
}
function charForBlock(b){
  const c=state.characters[b.name]||{};
  const expr=c.expressions?.find(x=>x.id===b.expressionId);
  return {c,icon:expr?.data||b.icon||c.icon};
}
function safeFileName(name){return String(name||"asset").replace(/[^\w.\-ぁ-んァ-ヶ一-龯]/g,"_").slice(0,120)||"asset"}

function renderTabs(){
  const allActive=isAllTab();
  $("#tabs").innerHTML=`<button class="tab ${allActive?"active":""}" data-tab="__ALL__">ALL</button>`+
    state.tabs.map(t=>`<button class="tab ${t.id===state.activeTab?"active":""}" data-tab="${t.id}">${esc(t.name)}</button>`).join("");
  $("#tabList").innerHTML=state.tabs.map((t,i)=>`<div class="list-item">
    <input type="checkbox" class="tab-check" data-tab-check="${t.id}" style="width:auto">
    <input data-tab-rename="${t.id}" value="${esc(t.name)}" style="flex:1;min-width:0">
    <button data-tab-up="${t.id}" ${i===0?"disabled":""}>↑</button>
    <button data-tab-down="${t.id}" ${i===state.tabs.length-1?"disabled":""}>↓</button>
    <button data-tab="${t.id}">開く</button>
  </div>`).join("");
  $$("#tabs [data-tab],#tabList [data-tab]").forEach(b=>b.onclick=()=>{
    state.activeTab=b.dataset.tab;if(!isAllTab())state.lastSingleTab=state.activeTab;state.selected=null;render()
  });
  $$("#tabList [data-tab-rename]").forEach(el=>el.oninput=()=>{
    const t=state.tabs.find(x=>x.id===el.dataset.tabRename);if(!t)return;
    t.name=el.value;
    if(t.id===state.activeTab)$("#activeName").textContent=t.name;
    const topBtn=$(`#tabs button[data-tab="${t.id}"]`);if(topBtn)topBtn.textContent=t.name;
    save();
  });
  $$("#tabList [data-tab-up]").forEach(b=>b.onclick=()=>{

function blockAction(id,act,btnEl){

  if(act==="up"&&i>0){[t.blocks[i-1],t.blocks[i]]=[t.blocks[i],t.blocks[i-1]];state.activeTab=t.id;render();return}
  if(act==="down"&&i<t.blocks.length-1){[t.blocks[i+1],t.blocks[i]]=[t.blocks[i],t.blocks[i+1]];state.activeTab=t.id;render();return}
  if(act==="del"){
    t.blocks.splice(i,1);state.selected=null;state.activeTab=t.id;render();return;

function insertBlockAfter(id,type){

// avatar-image-N の背景画像(data URL)を抽出する。
// 正規表現だけに頼ると、改行やコメント、複数セレクタなどCSSの書式差異で取りこぼし／
// 途中で切れて壊れたデータURLを拾ってしまうことがある（読込→書き出し後に画像が壊れる原因）。
// 実際に<style>をDOMへ挿入しCSSOM経由で読み取ることで確実に抽出する。
function extractAvatarMap(doc){
  const avatarMap={};
  [...doc.querySelectorAll("style")].forEach(st=>{
    let usedCssom=false;
    try{
      const tempStyle=document.createElement("style");
      tempStyle.textContent=st.textContent;
      document.head.appendChild(tempStyle);
      const sheet=tempStyle.sheet;
      if(sheet){
        [...sheet.cssRules].forEach(rule=>{
          const sel=rule.selectorText||"";
          const m=sel.match(/\.avatar-image-(\d+)/);
          if(m&&rule.style){
            const bg=rule.style.backgroundImage||"";
            const um=bg.match(/url\(["']?(data:[^"')]+)["']?\)/);
            if(um){avatarMap[m[1]]=um[1];usedCssom=true}
          }
        });
      }
      document.head.removeChild(tempStyle);
    }catch(e){/* CSSOMで読めない場合は下の正規表現フォールバックに任せる */}
    if(!usedCssom){
      const re=/\.avatar-image-(\d+)[^{]*\{[^}]*background-image:\s*url\(["']?(data:[^)"']+)["']?\)/g;let m;
      while((m=re.exec(st.textContent)))if(!avatarMap[m[1]])avatarMap[m[1]]=m[2];
    }
  });
  return avatarMap;
}
function parseNew(doc,name){

 // 基準に僅かに加算して並び順を維持する（無いと index=0発進になり最上部に集まってしまう）。
 let lastTime=0, pending=0;
 [...doc.querySelectorAll("article.message")].forEach((el,i)=>{
   const channel=el.dataset.channel||"main", speaker=el.querySelector(".speaker")?.textContent.trim()||"", time=el.querySelector("time")?.getAttribute("datetime");

   let text=el.querySelector(".message-text")?.textContent.trim()||"";
   if(rollEl){const rollText=rollEl.textContent.trim();text=text?text+"\n"+rollText:rollText}
   if(!groups.has(channel))groups.set(channel,[]);
   const isSystem=el.classList.contains("system"), isNarr=!speaker||speaker==="　"||isSystem;

   }

   const b=makeBlock(type,{name:speaker,text,nameColor:color,textColor,createdAt,icon});

 });

function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function concatBytes(parts){const len=parts.reduce((n,x)=>n+x.length,0),out=new Uint8Array(len);let p=0;for(const x of parts){out.set(x,p);p+=x.length}return out}
// ZIP (無圧縮/store方式) を手組みで生成する。
// 以前の実装はセントラルディレクトリヘッダに last mod date (2byte) が欠落しており、
// また終端レコード(EOCD)の central directory records 数フィールドが1つ分しかなく
// サイズ/オフセットが2byteずつズレて破損していた（Windows標準解凍ソフトで開けない原因）。
// 各フィールドを規格どおり明示的に積んで組み立てる。
function zipStore(entries){
  const enc=new TextEncoder();
  const localParts=[],centralParts=[];
  let offset=0;
  const UTF8_FLAG=0x0800; // ファイル名がUTF-8であることを示すフラグ（日本語ファイル名の文字化け防止）
  for(const e of entries){
    const name=enc.encode(e.name),data=e.data,crc=crc32(data);
    const lfh=concatBytes([
      u32(0x04034b50), // local file header signature
      u16(20),         // version needed to extract
      u16(UTF8_FLAG),  // general purpose bit flag（UTF-8ファイル名フラグ）
      u16(0),          // compression method (0=store)
      u16(0),          // last mod file time
      u16(0),          // last mod file date
      u32(crc),        // crc-32
      u32(data.length),// compressed size
      u32(data.length),// uncompressed size
      u16(name.length),// file name length
      u16(0)           // extra field length
    ]);
    const localEntry=concatBytes([lfh,name,data]);
    localParts.push(localEntry);
    const cdh=concatBytes([
      u32(0x02014b50), // central directory file header signature
      u16(20),         // version made by
      u16(20),         // version needed to extract
      u16(UTF8_FLAG),  // general purpose bit flag（UTF-8ファイル名フラグ）
      u16(0),          // compression method
      u16(0),          // last mod file time
      u16(0),          // last mod file date
      u32(crc),        // crc-32
      u32(data.length),// compressed size
      u32(data.length),// uncompressed size
      u16(name.length),// file name length
      u16(0),          // extra field length
      u16(0),          // file comment length
      u16(0),          // disk number start
      u16(0),          // internal file attributes
      u32(0),          // external file attributes
      u32(offset)      // relative offset of local header
    ]);
    centralParts.push(concatBytes([cdh,name]));
    offset+=localEntry.length;
  }
  const localBlob=concatBytes(localParts);
  const centralBlob=concatBytes(centralParts);
  const eocd=concatBytes([
    u32(0x06054b50),        // end of central directory signature
    u16(0),                 // number of this disk
    u16(0),                 // disk where central directory starts
    u16(entries.length),    // number of central directory records on this disk
    u16(entries.length),    // total number of central directory records
    u32(centralBlob.length),// size of central directory (bytes)
    u32(localBlob.length),  // offset of start of central directory (= size of all local entries)
    u16(0)                  // comment length
  ]);
  return concatBytes([localBlob,centralBlob,eocd]);
}
function downloadBlob(data,type,name){const blob=new Blob([data],{type}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function downloadZip(doc,assets,name){const entries=[{name:"index.html",data:new TextEncoder().encode(doc)}];for(const [data,path] of assets)entries.push({name:path,data:dataUrlBytes(data)});const zip=zipStore(entries);downloadBlob(zip,"application/zip",name)}
function exportBlock(b,assetPath){
 const s=state.settings;
 if(b.type==="bubble"){const {c,icon}=charForBlock(b),nameColor=effectiveBlock(b,"nameColor",effectiveChar(c,"nameColor",s.baseText)),textColor=effectiveBlock(b,"textColor",effectiveChar(c,"textColor",s.baseText)),bubbleColor=effectiveBlock(b,"bubbleColor",s.baseBubble),iconBg=c.iconBg||s.baseIconBg;const iconSrc=icon?(icon.startsWith("data:")?assetPath(icon,`${b.name||"character"}_icon`):icon):"";return `<div class="speech ${b.direction==="right"?"right":""}">${iconSrc?`<img class="avatar" style="background:${esc(iconBg)}" src="${esc(iconSrc)}">`:`<div class="avatar" style="background:${esc(iconBg)}"></div>`}<div class="content">${b.showName?`<div class="speaker" style="color:${esc(nameColor)}">${esc(b.name)}</div>`:""}<div class="bubble ${esc(b.shape)} ${b.direction==="right"?"right-tail":"left-tail"}" style="--bubble:${esc(bubbleColor)};background:${esc(bubbleColor)};color:${esc(textColor)};font-size:${fontSize(b.size)};font-weight:${esc(b.fontWeight||"400")}">${esc(b.text)}</div></div></div>`}
 if(b.type==="narration")return `<div class="narration" style="color:${esc(b.textColor||s.baseNarrationText)};font-size:${fontSize(b.size)};font-weight:${esc(b.fontWeight||"400")};text-align:${esc(b.align)}">${b.showName&&b.name?`<strong>${esc(b.name)}：</strong>`:""}${esc(b.text)}</div>`;
 if(b.type==="textbox"){const img=b.image?(b.image.startsWith("data:")?assetPath(b.image,`${b.title||"textbox"}_image`):b.image):"";return `<div class="textbox ${b.imageSide==="left"?"reverse":""}" style="background:${esc(b.boxColor||s.baseBoxColor)};color:${esc(b.textColor||s.baseBoxText)}"><div class="textbox-main">${b.title?`<div class="textbox-title">${esc(b.title)}</div>`:""}<div class="textbox-text">${esc(b.text)}</div></div>${img?`<img src="${esc(img)}">`:""}</div>`}
 if(b.type==="bgm"){const media=b.media?(b.media.startsWith("data:")?assetPath(b.media,b.text||"bgm"):b.media):"";return `<div class="bgm" style="background:${esc(b.bgColor||s.baseBgmBg)};color:${esc(b.textColor||s.baseBgmText)}"><span>${esc(b.text||"BGM")}</span><audio controls src="${esc(media)}"></audio></div>`}
 if(b.type==="media"){const media=b.media?(b.media.startsWith("data:")?assetPath(b.media,b.text||"media"):b.media):"";return b.mediaKind==="video"?`<div class="media"><video controls src="${esc(media)}"></video></div>`:b.mediaKind==="audio"?`<div class="media"><audio controls src="${esc(media)}"></audio></div>`:`<div class="media"><img src="${esc(media)}"></div>`}
 return `<div class="sep" style="background:${esc(b.color||s.separatorColor||s.baseText)}"></div>`;
}
$("#fileInput").onchange=e=>importFiles(e.target.files);
$("#addTab").onclick=()=>{newTab("新しいログ");render()};
function checkedTabIds(){
  return $$("#tabList .tab-check:checked").map(x=>x.dataset.tabCheck);
}
function mergeTabIds(ids){
  if(ids.length<2){alert("2つ以上のタブを選択してください。");return}
  const selected=state.tabs.filter(t=>ids.includes(t.id));
  const first=selected[0];
  const all=selected.flatMap(x=>x.blocks.map(b=>({...b,createdAt:Number(b.createdAt)||0,srcTab:x.name}))).sort((a,b)=>a.createdAt-b.createdAt);
  first.blocks=all;
  first.name=selected.map(x=>x.name).join(" + ");
  state.tabs=[...state.tabs.filter(t=>!ids.includes(t.id)||t.id===first.id)];
  state.activeTab=first.id;state.selected=null;render();
}
$("#mergeTabs").onclick=()=>{if(state.tabs.length<2)return;mergeTabIds(state.tabs.map(t=>t.id))};
$("#mergeSelected").onclick=()=>mergeTabIds(checkedTabIds());
$("#deleteSelected").onclick=()=>{
  const ids=checkedTabIds();
  if(!ids.length){alert("削除するタブを選択してください。");return}
  if(!confirm(`選択した ${ids.length} 個のタブを削除しますか？`))return;
  state.tabs=state.tabs.filter(t=>!ids.includes(t.id));
  if(!state.tabs.length)newTab("ログ");
  if(!state.tabs.some(t=>t.id===state.activeTab))state.activeTab=state.tabs[0].id;
  state.selected=null;render();
};
$$("[data-add]").forEach(b=>b.onclick=()=>addBlock(b.dataset.add));
$("#addChar").onclick=()=>{const n=prompt("キャラクター名");if(!n)return;charFor(n,"#333333");render();charEditor(state.characters[n].id)};
$("#mergeCharsSelected").onclick=mergeSelectedCharacters;$("#deleteCharsSelected").onclick=deleteSelectedCharacters;
$("#settingsBtn").onclick=openSettings;$("#exportBtn").onclick=exportHTML;$("#inspectorBtn").onclick=()=>$("#inspector").classList.toggle("open");
$("#backupExport").onclick=()=>{const blob=new Blob([JSON.stringify(state)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cocofolia-log-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("#backupImport").onclick=()=>$("#backupInput").click();
$("#backupInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=JSON.parse(await f.text());render()}catch(x){alert("バックアップの読み込みに失敗しました。")}};
$("#reset").onclick=()=>{if(confirm("保存データをすべて消去しますか？")){localStorage.removeItem("cocofolia_formatter_v1");state={settings:clone(defaultSettings),characters:{},tabs:[],allOnly:{id:"__ALL__",blocks:[]},activeTab:null,lastSingleTab:null,selected:null,media:{},templates:{bubble:[],narration:[],textbox:[]}};newTab();render()}};
