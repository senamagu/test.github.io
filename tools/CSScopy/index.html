<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS簡単コピー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap');
*{box-sizing:border-box}
:root{--bg:#f4f6f5;--panel:#fff;--text:#303535;--sub:#687070;--line:#d9dfdd;--accent:#3d7c8d;--accent2:#34c38e;--danger:#d85c5c}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:24px}
h1{font-size:26px;font-weight:900;margin:0 0 18px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:18px}
.tab{border:1px solid var(--line);background:#fff;padding:10px 18px;font-weight:900;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:14px}
.panel h2{font-size:18px;margin:0 0 14px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.app{padding:14px}}
.row{display:flex;gap:8px;align-items:center}
.field{margin-bottom:12px}
label{display:block;font-weight:900;font-size:14px;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;padding:9px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.color-row{display:grid;grid-template-columns:minmax(100px,1fr) 130px 42px;gap:8px;align-items:center;margin-bottom:8px}
.color-row input[type=text]{width:100%}
.color-picker{width:42px;height:40px;padding:2px}
.swatch{width:42px;height:40px;border:1px solid var(--line);display:block}
button{border:1px solid var(--line);background:#fff;padding:9px 13px;font-weight:700}
button:hover{filter:brightness(.97)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.green{background:var(--accent2);border-color:var(--accent2);color:#fff}
.danger{color:var(--danger)}
.small{font-size:12px;color:var(--sub)}
.user-card{border:1px solid var(--line);padding:10px;margin-bottom:8px}
.user-name{font-weight:900}
.actions{display:flex;gap:6px;flex-wrap:wrap}
#cssOutput{min-height:360px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,1fr);gap:14px;align-items:start}
.workspace-left,.workspace-right{min-width:0}
.workspace-right{position:sticky;top:14px}
.image-panel{margin-bottom:0}
@media(max-width:760px){.workspace{grid-template-columns:1fr}.workspace-right{position:static}}

.drop{border:1px dashed #adb8b5;padding:16px;text-align:center;color:var(--sub);margin-bottom:10px}
.canvas-wrap{height:360px;overflow:hidden;background:#e7ebea;position:relative;border:1px solid var(--line)}
#pickerCanvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{display:flex;gap:6px;align-items:center;margin-top:8px}
.zoom input{width:80px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal-box{background:#fff;max-width:850px;width:100%;max-height:90vh;padding:18px;display:flex;flex-direction:column}
.modal-box textarea{min-height:55vh}
.help{background:#f7faf9;border-left:4px solid var(--accent);padding:10px 12px;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
<h1>CSS簡単コピー</h1>

<div class="tabs" id="tabs">
  <button class="tab active" data-type="balloon">吹き出し</button>
  <button class="tab" data-type="chat">チャット</button>
  <button class="tab" data-type="status">ステータス</button>
  <button class="tab" data-type="stand">駒</button>
</div>

<div class="panel">
  <h2>Discordユーザー登録</h2>
  <div class="help">表示名はこの画面で分かりやすくするための名前です。生成されるCSSにはDiscord IDだけが入ります。駒の画像URLは駒タブ側で入力し、保存されません。</div>
  <div class="grid" style="margin-top:12px">
    <div>
      <div class="field"><label>表示名</label><input id="userName" placeholder="まぐ"></div>
      <div class="field"><label>DiscordユーザーID</label><input id="userId" inputmode="numeric" placeholder="123456789012345678"></div>
      <div class="actions">
        <button class="primary" id="saveUser">登録 / 更新</button>
        <button id="clearUser">入力クリア</button>
      </div>
    </div>
    <div id="userList"></div>
  </div>
</div>

<div class="workspace">
  <div class="workspace-left">
    <div class="panel">
      <h2>参考画像</h2>
      <div class="drop" id="dropArea">画像をここへドラッグ＆ドロップ<br>またはファイルを選択</div>
      <input type="file" id="imageFile" accept="image/*">
      <div class="zoom">
        <button id="zoomOut">−</button>
        <input id="zoomRange" type="range" min="25" max="500" value="100">
        <button id="zoomIn">＋</button>
        <span id="zoomLabel">100%</span>
        <button id="resetView">位置リセット</button>
      </div>
      <p class="small">画像上をドラッグして移動できます。画像をタップ/クリックすると、その場所の色を現在選択中のカラーへ入れます。</p>
    </div>
    <div id="main"></div>
  </div>
  <div class="workspace-right">
    <div class="panel image-panel">
      <h2>スポイト</h2>
      <div class="canvas-wrap"><canvas id="pickerCanvas"></canvas></div>
      <p class="small">スマホ・iPadでは1本指で移動、2本指で拡大縮小できます。</p>
    </div>
  </div>
</div>

<div class="panel">
  <div class="actions">
    <button class="green" id="copyCss">CSSをコピー</button>
    <button id="copyTempCss">仮置きCSSをコピー</button>
    <button id="showCss">CSSを見る</button>
    <button id="downloadHtml">このページをHTML保存</button>
  </div>
</div>
</div>

<div class="modal hidden" id="modal">
 <div class="modal-box">
   <h2 style="margin-top:0">生成CSS</h2>
   <textarea id="cssOutput" readonly></textarea>
   <div class="actions" style="margin-top:10px"><button class="primary" id="closeModal">閉じる</button></div>
 </div>
</div>

<script>
const TEMPLATES = {
balloon: `@import url("https://yudukiak.github.io/ccfoliaCSS/CSS/balloon/main.css");
@import url('https://fonts.googleapis.com/css2?family=New+Tegomin&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap');

* {  font-family: "Zen Kaku Gothic New", sans-serif !important;
     font-weight: 700 !important;
}

:root {
  --balloon-background-color: rgba(255, 255, 255, 0);

  --dice-display: none;
  --image-display: none;
  --skip-display: none;
  --close-display: none;

  --balloon-width: 900px;
  --balloon-border-width: 0px;
  --balloon-border-radius: 0px;

  --font-size-main: 3.5rem;
  --font-color-name: 《名前・文章》;
  --font-color-main: 《名前・文章》;
  --font-color-dice: 《通常》;
  --font-color-fail: 《失敗》;
  --font-color-success: 《成功》;
  --box-shadow 300ms cubic-bezier(0.0, 0, 0.0, 0);
}

.css-175dgcc {
    box-shadow: none !important;
    background-image: none !important;
}`,
chat: `@import url("https://yudukiak.github.io/ccfoliaCSS/CSS/chat/main.css");
@import url("https://yudukiak.github.io/ccfoliaCSS/CSS/chat/option_name.css");
@import url("https://yudukiak.github.io/ccfoliaCSS/CSS/chat/fix_freeze.css");
@import url('https://fonts.googleapis.com/css2?family=New+Tegomin&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap');

* {  font-family: "Zen Kaku Gothic New", sans-serif !important;
     font-weight: 700 !important;
}

.MuiListItemText-secondary {
    color: 《文章》 !important;
}
.MuiListItemText-secondary .css-1l6qhgm{
    color: 《成功》;
}
.MuiListItemText-secondary .css-1j13mke {
    color: 《失敗》;
}

.MuiListItemText-secondary .css-ucj12 {
  color: 《時間・通常》;
}

.MuiTypography-caption {
  color: 《時間・通常》 !important;
}

.MuiList-root>div:nth-child(1)>div>div:nth-last-child(-n+3)>div {
    display: flex !important;
  --magcolor: rgb(255, 244, 226);

  --border-width: 0px;
  --border-radius: 4px;
  --background-color: rgba(0, 0, 0, 0);
  --width: 450px;
}
/* アイコン消去 */
.MuiListItemAvatar-root {
    display: none !important;
}

/* アイコン分の余白を削除 */
.MuiListItemText-root {
    margin-left: 0 !important;
}`,
status: `@import url("https://yudukiak.github.io/ccfoliaCSS/CSS/status/main.css");
@import url("https://use.typekit.net/tur0rsk.css");

* {  font-family: "dazzle-unicase", sans-serif !important;
  font-weight: 700 !important;
  font-style: normal !important;}

:root{
 /* ステータスの列数（1 = 縦に1列） */
  --status-column: 1;

 /* アバターを消す */
  --avatar-padding: 0;
  --avatar-display: none;

 /* ステータスの変動バー色変更 */
  --background-color: 《変動バー色》;

 /* 文字の縁取りの色変更 */
  --status-font-border-color: rgba(237, 236, 232, 0);

    --status-font-size: 2rem;
    --status-font-color: var(--font-color, 《名前》);
    --status-font-secondary-color: var(--font-color-fail, 《ピンチ》);
}

div:has(> p.MuiTypography-root.MuiTypography-body2)
+ div:has(> div[style*="width:"][style*="%"]),
div:has(> p.MuiTypography-root.MuiTypography-body2)
+ div:has(> div[style*="width:"][style*="%"]) > div[style*="width:"] {
  opacity: 1;
}

div:has(> p.MuiTypography-root.MuiTypography-body2)
+ div:has(> div[style*="width:"][style*="%"]) > div:not([style]) {
 /* ステータスの背景色変更 */
  background: 《背景色》 ;
 /* ステータスの背景不透明度変更 */
  opacity: 0.7 ;
}

.MuiTypography-root span {
    height: auto;
}
#root > div {
  padding: 0;
}

#root > div > div {
  margin: 0;
}

[variant='bar'] > div {
  margin-left: 0;
  width: calc(var(--status-width) + var(--add-bar-margin));
}

[variant='bar'] > div > div:nth-child(2) > div {
  height: calc(var(--status-height) / 3);
  margin-left: calc(-1 * var(--add-bar-margin) / 2);
  margin-top: calc(var(--status-height) / 2);
}`,
stand: `:root {
  /* 画像のみ変更したいときはここのURLを書き換える */
  /* discordユーザーID  */
  --img-stand-url-〈discordユーザーID〉: url("『画像URL』");
  --img-mouth-url-〈discordユーザーID〉: url("");
}

/* ここから下は見た目の変更用CSS */
body, #root {
  overflow: hidden !important;
}
[class*="Voice_voiceStates__"] {
  display: flex; 
  align-items: flex-end; 
  padding: 16px;
} 
[class*="Voice_voiceState__"] {
  height: auto; 
  margin-bottom: 0px;
} 
[class*="Voice_avatar__"] {
  filter: brightness(70%);
} 
[class*="Voice_avatarSpeaking__"] {
  position: relative; 
  filter: brightness(100%); 
  animation-duration: 750ms;
}  
[class*="Voice_name__"] {
  display: none;
}

img {
  display: none;
}

img[src*="avatars/〈discordユーザーID〉"] {
  content: var(--img-stand-url-〈discordユーザーID〉);
  display: block;
  width: auto;
  height: auto;
  border-radius: 0;
  border: none;
}
img:not([src*="avatars/〈discordユーザーID〉"]), img:not([src*="avatars/〈discordユーザーID〉"]) + [class*="Voice_user__"] {
  display: none;
}`
};

const COLOR_DEFS = {
 balloon:[
  ["名前・文章","nameText"],["通常","normal"],["失敗","fail"],["成功","success"]
 ],
 chat:[
  ["文章","nameText"],["成功","success"],["失敗","fail"],["時間・通常","normal"]
 ],
 status:[
  ["変動バー色","statusBar"],["名前","statusName"],["ピンチ","statusPinch"],["背景色","statusBg"]
 ]
};

let state = JSON.parse(localStorage.getItem("cssEasyCopyState")||"null") || {
 colors:{nameText:"#FFFFFF",normal:"#AAAAAA",fail:"#FF5555",success:"#55CC77",statusBar:"#AAAAAA",statusName:"#FFFFFF",statusPinch:"#FF5555",statusBg:"#000000"},
 users:[],
 selectedUser:null
};
state.users = state.users.map(u=>({name:u.name,id:u.id}));
let currentType="balloon", selectedColorKey="nameText", editingUser=-1;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem("cssEasyCopyState",JSON.stringify(state));}
function normalizeColor(v){
 v=String(v||"").trim();
 if(/^#?[0-9a-fA-F]{6}$/.test(v)) return "#"+v.replace("#","").toUpperCase();
 const m=v.match(/^rgb\\s*\\(\\s*(\\d+)\\s*,\\s*(\\d+)\\s*,\\s*(\\d+)\\s*\\)$/i) || v.match(/^(\\d+)\\s*,\\s*(\\d+)\\s*,\\s*(\\d+)$/);
 if(m){
   const n=m.slice(1).map(Number);
   if(n.every(x=>x>=0&&x<=255)) return "#"+n.map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();
 }
 return null;
}
function render(){
 $("#main").innerHTML="";
 const p=document.createElement("div");p.className="panel";
 if(currentType==="stand"){renderStand(p)} else {renderColors(p)}
 $("#main").appendChild(p);
}
function renderColors(p){
 p.innerHTML="<h2>"+({balloon:"吹き出しのカラー",chat:"チャットのカラー",status:"ステータスのカラー"}[currentType])+"</h2>";
 const defs=COLOR_DEFS[currentType];
 defs.forEach(([label,key])=>{
   const row=document.createElement("div");row.className="color-row";
   row.innerHTML=`<label style="margin:0">${label}</label><input type="text" value="${esc(state.colors[key])}" data-color="${key}" title="カラーコード"><input class="color-picker" type="color" value="${state.colors[key]}" data-picker="${key}">`;
   p.appendChild(row);
   row.querySelector('[data-color]').addEventListener("focus",()=>selectedColorKey=key);
   row.querySelector('[data-color]').addEventListener("input",e=>{
     selectedColorKey=key; const c=normalizeColor(e.target.value); if(c){state.colors[key]=c; save(); row.querySelector('[data-picker]').value=c;}
   });
   row.querySelector('[data-picker]').addEventListener("focus",()=>selectedColorKey=key);
   row.querySelector('[data-picker]').addEventListener("input",e=>{selectedColorKey=key;state.colors[key]=e.target.value.toUpperCase();save();row.querySelector('[data-color]').value=state.colors[key]});
 });
 const note=document.createElement("p");note.className="small";note.textContent="※ 吹き出しとチャットは対応する色を共有しています。";
 if(currentType!=="status")p.appendChild(note);
}
let standUrls = {stand:"", mouth:""};

function renderStand(p){
 p.innerHTML="<h2>駒</h2>";

 const f=document.createElement("div");
 f.className="field";
 f.innerHTML="<label>Discordユーザー</label><select id='standUser'><option value=''>選択してください</option>"+
   state.users.map((u,i)=>`<option value="${i}" ${state.selectedUser===i?"selected":""}>${esc(u.name)}（${esc(u.id)}）</option>`).join("")+
   "</select>";
 p.appendChild(f);

 const selected=state.users[state.selectedUser];

 const info=document.createElement("div");
 info.className="help";
 info.innerHTML=selected
   ? `Discord ID：${esc(selected.id)}<br>表示名：${esc(selected.name)}`
   : "Discordユーザー登録からユーザーを登録してください。";
 p.appendChild(info);

 if(selected){
   const urlBox=document.createElement("div");
   urlBox.style.marginTop="12px";
   urlBox.innerHTML=`
     <div class="field">
       <label>立ち絵画像URL</label>
       <input id="standImageUrl" type="text" placeholder="https://..." value="${esc(standUrls.stand)}">
     </div>
     <div class="field">
       <label>口パク画像URL（任意）</label>
       <input id="mouthImageUrl" type="text" placeholder="https://..." value="${esc(standUrls.mouth)}">
     </div>
     <p class="small">画像URLは保存されません。現在入力しているURLをそのままCSSへ差し込みます。</p>`;
   p.appendChild(urlBox);

   $("#standImageUrl").addEventListener("input",e=>standUrls.stand=e.target.value);
   $("#mouthImageUrl").addEventListener("input",e=>standUrls.mouth=e.target.value);
 }

 p.querySelector("#standUser").addEventListener("change",e=>{
   state.selectedUser=e.target.value===""?null:Number(e.target.value);
   standUrls={stand:"",mouth:""};
   save();
   render();
 });
}
function renderUsers(){
 const box=$("#userList");box.innerHTML="";
 if(!state.users.length){box.innerHTML='<p class="small">登録されたユーザーはいません。</p>';return}
 state.users.forEach((u,i)=>{
   const d=document.createElement("div");d.className="user-card";
   d.innerHTML=`<div class="user-name">${esc(u.name)}</div><div class="small">ID：${esc(u.id)}</div><div class="actions" style="margin-top:7px"><button data-edit="${i}">編集</button><button class="danger" data-del="${i}">削除</button></div>`;
   box.appendChild(d);
 });
 box.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editUser(Number(b.dataset.edit)));
 box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.del);if(confirm("このユーザーを削除しますか？")){state.users.splice(i,1);if(state.selectedUser===i)state.selectedUser=null;else if(state.selectedUser>i)state.selectedUser--;save();renderUsers();render();}});
}
function editUser(i){
 const u=state.users[i];editingUser=i;
 $("#userName").value=u.name;$("#userId").value=u.id;
}
function clearUser(){editingUser=-1;["userName","userId"].forEach(id=>$("#"+id).value="")}
$("#saveUser").onclick=()=>{
 const name=$("#userName").value.trim(),id=$("#userId").value.trim();
 if(!name||!id){alert("表示名とDiscordユーザーIDを入力してください。");return}
 const u={name,id};
 if(editingUser>=0)state.users[editingUser]=u;else state.users.push(u);
 save();clearUser();renderUsers();render();
};
$("#clearUser").onclick=clearUser;
function replaceTemplate(){
 let css=TEMPLATES[currentType];
 if(currentType==="stand"){
   const u=state.users[state.selectedUser];
   if(!u)return css.replaceAll("〈discordユーザーID〉","").replaceAll("『画像URL』","");
   css=css.replaceAll("〈discordユーザーID〉",u.id)
     .replace('『画像URL』',standUrls.stand||"")
     .replace('url("");',`url("${standUrls.mouth||""}");`);
   return css;
 }
 const map=currentType==="balloon"
 ?{"名前・文章":"nameText","通常":"normal","失敗":"fail","成功":"success"}
 :currentType==="chat"
 ?{"文章":"nameText","成功":"success","失败":"fail","失敗":"fail","時間・通常":"normal"}
 :{"変動バー色":"statusBar","名前":"statusName","ピンチ":"statusPinch","背景色":"statusBg"};
 Object.entries(map).forEach(([label,key])=>{css=css.replaceAll("《"+label+"》",state.colors[key]||"#000000")});
 return css;
}
function copyCss(){
 const css=replaceTemplate();
 navigator.clipboard.writeText(css).then(()=>alert("CSSをコピーしました。")).catch(()=>{ $("#cssOutput").value=css;$("#modal").classList.remove("hidden");$("#cssOutput").select();});
}

function getTypeName(){
 return {balloon:"吹き出し",chat:"チャット",status:"ステータス",stand:"駒"}[currentType] || currentType;
}

function getTemporaryCss(){
 return "# " + getTypeName() + "\n```\n" + replaceTemplate() + "\n```";
}

function copyTempCss(){
 const css=getTemporaryCss();
 navigator.clipboard.writeText(css).then(()=>alert("仮置きCSSをコピーしました。")).catch(()=>{ $("#cssOutput").value=css;$("#modal").classList.remove("hidden");$("#cssOutput").select();});
}

$("#copyCss").onclick=copyCss;
$("#copyTempCss").onclick=copyTempCss;
$("#showCss").onclick=()=>{$("#cssOutput").value=replaceTemplate();$("#modal").classList.remove("hidden")};
$("#closeModal").onclick=()=>$("#modal").classList.add("hidden");

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
 currentType=t.dataset.type;render();
});
render();renderUsers();

let img=null, scale=1, ox=0, oy=0, dragging=false, sx=0, sy=0;
const canvas=$("#pickerCanvas"),ctx=canvas.getContext("2d");
function resizeCanvas(){const r=canvas.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";draw()}
window.addEventListener("resize",resizeCanvas);
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
 if(!img)return;
 const d=devicePixelRatio||1;
 ctx.setTransform(d,0,0,d,0,0);
 const w=img.width*scale,h=img.height*scale;
 ctx.drawImage(img,ox,oy,w,h);
}
function setZoom(v){scale=Number(v)/100;$("#zoomRange").value=v;$("#zoomLabel").textContent=Math.round(v)+"%";draw()}
$("#zoomRange").oninput=e=>setZoom(e.target.value);
$("#zoomIn").onclick=()=>setZoom(Math.min(500,Math.round(scale*100+25)));
$("#zoomOut").onclick=()=>setZoom(Math.max(25,Math.round(scale*100-25)));
$("#resetView").onclick=()=>{scale=1;ox=0;oy=0;setZoom(100)};
function loadImage(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=e=>{const im=new Image();im.onload=()=>{img=im;scale=1;ox=(canvas.clientWidth-im.width)/2;oy=(canvas.clientHeight-im.height)/2;setZoom(100)};im.src=e.target.result};
 reader.readAsDataURL(file);
}
$("#imageFile").onchange=e=>loadImage(e.target.files[0]);
$("#dropArea").ondragover=e=>{e.preventDefault();$("#dropArea").style.borderColor="var(--accent)"};
$("#dropArea").ondragleave=()=>$("#dropArea").style.borderColor="";
$("#dropArea").ondrop=e=>{e.preventDefault();$("#dropArea").style.borderColor="";loadImage(e.dataTransfer.files[0])};
let pointers=new Map();
let pinchStartDistance=0, pinchStartScale=1;
let pinchStartCenter={x:0,y:0}, pinchStartOffset={x:0,y:0};

function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function center(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const p=pointerPos(e);
  pointers.set(e.pointerId,p);

  if(pointers.size===1){
    dragging=true;
    sx=p.x-ox; sy=p.y-oy;
  }else if(pointers.size===2){
    dragging=false;
    const pts=[...pointers.values()];
    pinchStartDistance=distance(pts[0],pts[1]);
    pinchStartScale=scale;
    pinchStartCenter=center(pts[0],pts[1]);
    pinchStartOffset={x:ox,y:oy};
  }
});

canvas.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  e.preventDefault();
  pointers.set(e.pointerId,pointerPos(e));

  if(pointers.size===1 && dragging){
    const p=[...pointers.values()][0];
    ox=p.x-sx; oy=p.y-sy; draw();
  }else if(pointers.size===2){
    const pts=[...pointers.values()];
    const d=distance(pts[0],pts[1]);
    if(!pinchStartDistance)return;

    const factor=d/pinchStartDistance;
    const oldScale=scale;
    scale=Math.max(.25,Math.min(5,pinchStartScale*factor));

    // ピンチの中心位置を固定して拡大縮小
    const c=center(pts[0],pts[1]);
    const imageX=(pinchStartCenter.x-pinchStartOffset.x)/oldScale;
    const imageY=(pinchStartCenter.y-pinchStartOffset.y)/oldScale;
    ox=c.x-imageX*scale;
    oy=c.y-imageY*scale;

    $("#zoomRange").value=Math.round(scale*100);
    $("#zoomLabel").textContent=Math.round(scale*100)+"%";
    draw();
  }
});

canvas.addEventListener("pointerup",e=>{
  const wasSingle=pointers.size===1;
  const p=pointers.get(e.pointerId);
  pointers.delete(e.pointerId);

  if(pointers.size===0){
    dragging=false;
    if(wasSingle && p){
      // タップ判定。移動中の誤スポイトを避けるため大きな移動は除外。
      const moved=Math.hypot((p.x-sx), (p.y-sy));
      if(moved<8 && img){
        const x=Math.floor((p.x-ox)/scale),y=Math.floor((p.y-oy)/scale);
        if(x>=0&&y>=0&&x<img.width&&y<img.height){
          const temp=document.createElement("canvas");
          temp.width=img.width;temp.height=img.height;
          const tc=temp.getContext("2d");
          tc.drawImage(img,0,0);
          const d=tc.getImageData(x,y,1,1).data;
          const c="#"+[d[0],d[1],d[2]].map(n=>n.toString(16).padStart(2,"0")).join("").toUpperCase();
          state.colors[selectedColorKey]=c;
          save();render();
        }
      }
    }
  }else if(pointers.size===1){
    const p2=[...pointers.values()][0];
    dragging=true;sx=p2.x-ox;sy=p2.y-oy;
  }
});

canvas.addEventListener("pointercancel",e=>{
  pointers.delete(e.pointerId);
  if(pointers.size===0)dragging=false;
});

$("#downloadHtml").onclick=()=>{
 const blob=new Blob([document.documentElement.outerHTML],{type:"text/html;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="css-easy-copy.html";a.click();URL.revokeObjectURL(a.href);
};
resizeCanvas();
</script>
